    var userAnswers = {};
    var bookmarks = {};
    var activeTimers = {};
    var timeElapsed = {};
    var questionsContainer = document.getElementById('questionsContainer');
    var searchInput = document.getElementById('searchInput');
    var currentTopic = 'all';
    var currentYear = 'all';
    var currentType = 'all';
    var currentQuery = '';
    var globalTimeLeft = 2400;
    var globalTimerInterval = null;
    var redoMode = false;
    var renderedCards = {};
    var observer = null;

    function saveProgress() {
      try {
        localStorage.setItem('cat_answers', JSON.stringify(userAnswers));
        localStorage.setItem('cat_timers', JSON.stringify(timeElapsed));
        localStorage.setItem('cat_bookmarks', JSON.stringify(bookmarks));
      } catch(e) {}
    }
    function loadProgress() {
      try {
        var s = localStorage.getItem('cat_answers');
        if (s) userAnswers = JSON.parse(s);
        var t = localStorage.getItem('cat_timers');
        if (t) timeElapsed = JSON.parse(t);
        var b = localStorage.getItem('cat_bookmarks');
        if (b) bookmarks = JSON.parse(b);
      } catch(e) {}
    }
    function isCorrectAnswer(input, correct) {
      var a = parseFloat(input.trim());
      var b = parseFloat(correct.trim());
      if (!isNaN(a) && !isNaN(b)) return Math.abs(a - b) < 0.001;
      return input.trim().toLowerCase() === correct.trim().toLowerCase();
    }

    function init() {
      loadProgress();
      setupObserver();
      applyFilters();
      updateStats();
      searchInput.addEventListener('input', function(e) {
        currentQuery = e.target.value.toLowerCase();
        applyFilters();
      });
      document.addEventListener('keydown', handleKeyboard);
      window.addEventListener('scroll', updateSidebarHighlight);
    }

    function setupObserver() {
      observer = new IntersectionObserver(function(entries) {
        for (var i = 0; i < entries.length; i++) {
          if (entries[i].isIntersecting) {
            var card = entries[i].target;
            var qid = card.getAttribute('data-qid');
            if (qid && !renderedCards[qid]) {
              renderCard(card, parseInt(qid));
              renderedCards[qid] = true;
            }
          }
        }
      }, { rootMargin: '300px' });
    }

    function getTopicClass(topic) {
      if (topic.indexOf('Algebra') !== -1) return 'algebra';
      if (topic.indexOf('Average') !== -1 || topic.indexOf('Ratio') !== -1) return 'arith';
      if (topic.indexOf('Percentage') !== -1 || topic.indexOf('Profit') !== -1) return 'ppl';
      return 'tsd';
    }
    function getTopicShort(topic) {
      if (topic.indexOf('Algebra') !== -1) return 'Algebra';
      if (topic.indexOf('Average') !== -1 || topic.indexOf('Ratio') !== -1) return 'Avg & Ratio';
      if (topic.indexOf('Percentage') !== -1 || topic.indexOf('Profit') !== -1) return 'PPL';
      return 'TSD&W';
    }

    function applyFilters() {
      var filtered = [];
      for (var i = 0; i < questionsData.length; i++) {
        var q = questionsData[i];
        if (currentTopic !== 'all' && q.topic !== currentTopic) continue;
        if (currentYear !== 'all' && q.year !== currentYear) continue;
        if (currentType === 'mcq' && q.type !== 'MCQ') continue;
        if (currentType === 'tita' && q.type !== 'TITA') continue;
        if (currentType === 'unsolved' && userAnswers[q.id] !== undefined) continue;
        if (currentType === 'solved' && userAnswers[q.id] === undefined) continue;
        if (currentType === 'correct' && (userAnswers[q.id] === undefined || !userAnswers[q.id].isCorrect)) continue;
        if (currentType === 'incorrect' && (userAnswers[q.id] === undefined || userAnswers[q.id].isCorrect)) continue;
        if (currentType === 'bookmarked' && !bookmarks[q.id]) continue;
        if (currentQuery) {
          var text = (q.text + ' ' + q.meta + ' ' + q.topic + ' ' + q.year).toLowerCase();
          if (text.indexOf(currentQuery) === -1) continue;
        }
        filtered.push(q);
      }
      renderedCards = {};
      renderQuestions(filtered);
      renderSidebar(filtered);
      updateSidebarProgress();
    }

    function renderQuestions(data) {
      questionsContainer.innerHTML = '';
      if (data.length === 0) {
        questionsContainer.innerHTML = '<div style="text-align:center;padding:60px 40px;color:var(--text-tertiary)"><i class="fa-regular fa-folder-open" style="font-size:28px;margin-bottom:10px;display:block;opacity:.4"></i>No questions match.</div>';
        return;
      }
      for (var i = 0; i < data.length; i++) {
        var q = data[i];
        var card = document.createElement('div');
        var tc = getTopicClass(q.topic);
        card.className = 'q-card topic-' + tc;
        card.id = 'q-card-' + q.id;
        card.setAttribute('data-qid', q.id);
        card.innerHTML = '<div class="q-header"><div class="q-meta"><span class="q-number">Q' + q.id + '</span><span class="q-exam-pill">' + q.meta + '</span><span class="q-type-pill ' + (q.type === 'MCQ' ? 'mcq' : 'tita') + '">' + q.type + '</span><span class="q-topic-tag ' + tc + '">' + getTopicShort(q.topic) + '</span></div><div class="q-actions"><button class="q-action-btn' + (bookmarks[q.id] ? ' bookmarked' : '') + '" onclick="toggleBookmark(' + q.id + ')" title="Bookmark"><i class="fa-' + (bookmarks[q.id] ? 'solid' : 'regular') + ' fa-star"></i></button><div class="q-timer-box"><span class="timer-sm" id="timer-' + q.id + '">00:00</span><button class="timer-btn-sm" id="timer-btn-' + q.id + '" onclick="toggleTimer(' + q.id + ')"><i class="fa-solid fa-play"></i></button><button class="timer-btn-sm" onclick="resetTimer(' + q.id + ')"><i class="fa-solid fa-rotate-right"></i></button></div></div></div><div class="q-body"><div class="skeleton" style="height:60px;margin-bottom:8px"></div><div class="skeleton" style="height:20px;width:80%"></div></div>';
        questionsContainer.appendChild(card);
        observer.observe(card);
      }
    }

    function renderCard(card, qId) {
      var q = null;
      for (var i = 0; i < questionsData.length; i++) { if (questionsData[i].id === qId) { q = questionsData[i]; break; } }
      if (!q) return;
      var tc = getTopicClass(q.topic);
      var isAnswered = userAnswers[q.id] !== undefined;
       var isCorrect = isAnswered && userAnswers[q.id].isCorrect;
      var typeClass = q.type === 'MCQ' ? 'mcq' : 'tita';
      function renderOpt(t){return t.replace(/\[IMG:([^\]]+)\]/g,'<img src="$1" style="max-height:60px" onerror="this.style.display=\'none\'">');}
      var optionsHTML = '';
      if (q.type === 'MCQ' && q.options) {
        optionsHTML = '<div class="options-grid">';
        for (var j = 0; j < q.options.length; j++) {
          var opt = q.options[j]; var letter = opt.charAt(0); var sc = '';
          if (redoMode && isAnswered && !isCorrect) { sc = ''; }
          else if (isAnswered) {
            if (letter === q.correct) sc = 'correct-choice';
            else if (userAnswers[q.id].selected === letter) sc = 'incorrect-choice';
            else sc = 'disabled';
          }
          var letterStr = "'" + letter + "'";
          optionsHTML += '<button class="option-btn ' + sc + '" onclick="selectOption(' + q.id + ',' + letterStr + ')"><span>' + renderOpt(opt) + '</span>';
          if (sc === 'correct-choice') optionsHTML += '<i class="fa-solid fa-circle-check"></i>';
          if (sc === 'incorrect-choice') optionsHTML += '<i class="fa-solid fa-circle-xmark"></i>';
          optionsHTML += '</button>';
        }
        optionsHTML += '</div>';
      } else if (q.type === 'TITA') {
        var val = (isAnswered && userAnswers[q.id]) ? userAnswers[q.id].selected : '';
        var titaDisabled = isAnswered && !(redoMode && !isCorrect);
        optionsHTML = '<div class="tita-wrap"><input type="text" id="tita-input-' + q.id + '" class="tita-input" placeholder="Type answer..." value="' + val + '"' + (titaDisabled ? ' disabled' : '') + '><button class="submit-btn" onclick="submitTITA(' + q.id + ')"' + (titaDisabled ? ' disabled' : '') + '>Submit</button></div>';
      }
      var statusHTML = '';
      if (isAnswered) statusHTML = '<span class="status-badge ' + (isCorrect ? 'correct' : 'incorrect') + '"><i class="fa-solid ' + (isCorrect ? 'fa-check' : 'fa-xmark') + '"></i> ' + (isCorrect ? 'Correct' : 'Incorrect') + '</span>';
      var correctDisplay = q.correct;
      if (q.type === 'MCQ' && q.options) {
        for (var k = 0; k < q.options.length; k++) {
          if (q.options[k].charAt(0) === q.correct) { correctDisplay = q.options[k]; break; }
        }
      }
      var redoBtnHTML = isAnswered ? '<button class="btn-sm redo-btn" onclick="redoQuestion(' + q.id + ')"><i class="fa-solid fa-rotate-right"></i> Redo</button>' : '';
      card.innerHTML = '<div class="q-header"><div class="q-meta"><span class="q-number">Q' + q.id + '</span><span class="q-exam-pill">' + q.meta + '</span><span class="q-type-pill ' + typeClass + '">' + q.type + '</span><span class="q-topic-tag ' + tc + '">' + getTopicShort(q.topic) + '</span></div><div class="q-actions"><button class="q-action-btn' + (bookmarks[q.id] ? ' bookmarked' : '') + '" onclick="toggleBookmark(' + q.id + ')" title="Bookmark"><i class="fa-' + (bookmarks[q.id] ? 'solid' : 'regular') + ' fa-star"></i></button><div class="q-timer-box"><span class="timer-sm" id="timer-' + q.id + '">00:00</span><button class="timer-btn-sm" id="timer-btn-' + q.id + '" onclick="toggleTimer(' + q.id + ')"><i class="fa-solid fa-play"></i></button><button class="timer-btn-sm" onclick="resetTimer(' + q.id + ')"><i class="fa-solid fa-rotate-right"></i></button></div></div></div><div class="q-body"><p>' + q.text + '</p></div>' + optionsHTML + '<div class="q-footer"><div class="q-footer-left"><button class="btn-sm" onclick="toggleSolution(' + q.id + ')"><i class="fa-regular fa-lightbulb"></i> Solution</button>' + redoBtnHTML + '<button class="btn-sm copy-btn" onclick="copyQuestion(' + q.id + ',this)"><i class="fa-regular fa-copy"></i> Copy</button></div><div id="status-' + q.id + '">' + statusHTML + '</div></div><div class="solution-box" id="solution-' + q.id + '"><strong>Correct Answer:</strong> ' + q.correct + ' &mdash; ' + correctDisplay + '</div>';
      var imgs = card.querySelectorAll('img');
      for (var im = 0; im < imgs.length; im++) {
        imgs[im].onerror = function() {
          var src = this.getAttribute('src');
          if (src && src.indexOf('http://') === 0) {
            this.src = src.replace('http://', 'https://');
            return;
          }
          this.style.display='none';
          var fb=document.createElement('div');
          fb.className='img-fallback';
          fb.innerHTML='<i class="fa-regular fa-image" style="margin-right:4px"></i> Image not loaded — <a href="' + (src||'') + '" target="_blank" style="color:var(--accent-bright);text-decoration:underline">open link</a>';
          this.parentNode.insertBefore(fb,this);
        };
      }
      if (timeElapsed[q.id]) { var te = document.getElementById('timer-' + q.id); if (te) te.innerText = formatTime(timeElapsed[q.id]); }
    }

    function toggleTimer(id) {
      var btn = document.getElementById('timer-btn-' + id);
      if (!btn) return;
      if (!activeTimers[id]) {
        activeTimers[id] = setInterval(function() {
          timeElapsed[id] = (timeElapsed[id] || 0) + 1;
          var te = document.getElementById('timer-' + id);
          if (te) te.innerText = formatTime(timeElapsed[id]);
        }, 1000);
        btn.innerHTML = '<i class="fa-solid fa-pause"></i>'; btn.classList.add('active');
      } else {
        clearInterval(activeTimers[id]); activeTimers[id] = null;
        btn.innerHTML = '<i class="fa-solid fa-play"></i>'; btn.classList.remove('active');
      }
    }
    function resetTimer(id) {
      if (activeTimers[id]) { clearInterval(activeTimers[id]); activeTimers[id] = null; }
      timeElapsed[id] = 0;
      var te = document.getElementById('timer-' + id);
      if (te) te.innerText = '00:00';
      var btn = document.getElementById('timer-btn-' + id);
      if (btn) { btn.innerHTML = '<i class="fa-solid fa-play"></i>'; btn.classList.remove('active'); }
    }
    function formatTime(s) { var m = Math.floor(s/60); var sec = s%60; return (m<10?'0':'')+m+':'+(sec<10?'0':'')+sec; }

    function selectOption(qId, selectedOpt) {
      var question = null;
      for (var i = 0; i < questionsData.length; i++) { if (questionsData[i].id === qId) { question = questionsData[i]; break; } }
      if (!question) return;
      if (redoMode && userAnswers[qId] && !userAnswers[qId].isCorrect) {
        userAnswers[qId] = { selected: selectedOpt, isCorrect: selectedOpt === question.correct, redo: true };
        if (activeTimers[qId]) toggleTimer(qId);
        saveProgress(); updateStats(); rerenderCard(qId); updateSidebarItem(qId); updateSidebarProgress();
        return;
      }
      if (userAnswers[qId]) return;
      userAnswers[qId] = { selected: selectedOpt, isCorrect: selectedOpt === question.correct };
      if (activeTimers[qId]) toggleTimer(qId);
      saveProgress(); updateStats(); rerenderCard(qId); updateSidebarItem(qId); updateSidebarProgress();
    }
    function submitTITA(qId) {
      var question = null;
      for (var i = 0; i < questionsData.length; i++) { if (questionsData[i].id === qId) { question = questionsData[i]; break; } }
      if (!question) return;
      var inputEl = document.getElementById('tita-input-' + qId);
      var inputVal = inputEl ? inputEl.value.trim() : '';
      if (!inputVal) return;
      if (redoMode && userAnswers[qId] && !userAnswers[qId].isCorrect) {
        userAnswers[qId] = { selected: inputVal, isCorrect: isCorrectAnswer(inputVal, question.correct), redo: true };
        if (activeTimers[qId]) toggleTimer(qId);
        saveProgress(); updateStats(); rerenderCard(qId); updateSidebarItem(qId); updateSidebarProgress();
        return;
      }
      if (userAnswers[qId]) return;
      userAnswers[qId] = { selected: inputVal, isCorrect: isCorrectAnswer(inputVal, question.correct) };
      if (activeTimers[qId]) toggleTimer(qId);
      saveProgress(); updateStats(); rerenderCard(qId); updateSidebarItem(qId); updateSidebarProgress();
    }
    function redoQuestion(qId) {
      if (!userAnswers[qId]) return;
      delete userAnswers[qId];
      saveProgress(); updateStats(); rerenderCard(qId); updateSidebarItem(qId); updateSidebarProgress();
      var el = document.getElementById('q-card-' + qId);
      if (el) el.scrollIntoView({behavior:'smooth',block:'center'});
    }
    function toggleSolution(id) { var el = document.getElementById('solution-' + id); if (el) el.classList.toggle('show'); }
    function toggleBookmark(qId) {
      bookmarks[qId] = !bookmarks[qId];
      if (!bookmarks[qId]) delete bookmarks[qId];
      saveProgress();
      rerenderCard(qId); updateSidebarItem(qId); updateSidebarProgress();
    }

    function copyQuestion(qId, btn) {
      var q = null;
      for (var i = 0; i < questionsData.length; i++) { if (questionsData[i].id === qId) { q = questionsData[i]; break; } }
      if (!q) return;
      var textContent = q.text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
      var copyText = 'Q' + q.id + ' (' + q.meta + ')\n\n' + textContent;
      if (q.type === 'MCQ' && q.options) {
        copyText += '\n\n' + q.options.join('\n');
      }
      copyText += '\n\nCorrect Answer: ' + q.correct;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(copyText).then(function() {
          showCopied(btn);
        }).catch(function() {
          fallbackCopy(copyText, btn);
        });
      } else {
        fallbackCopy(copyText, btn);
      }
    }
    function fallbackCopy(text, btn) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showCopied(btn); } catch(e) {}
      document.body.removeChild(ta);
    }
    function showCopied(btn) {
      btn.classList.add('copied');
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
      setTimeout(function() {
        btn.classList.remove('copied');
        btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
      }, 1500);
    }

    function rerenderCard(qId) {
      var card = document.getElementById('q-card-' + qId);
      if (card) { renderedCards[qId] = false; renderCard(card, qId); renderedCards[qId] = true; }
    }

    function updateStats() {
      var keys = Object.keys(userAnswers); var solved = keys.length; var correct = 0;
      for (var i = 0; i < keys.length; i++) { if (userAnswers[keys[i]].isCorrect) correct++; }
      var acc = solved > 0 ? Math.round((correct/solved)*100) : 0;
      document.getElementById('stat-solved').innerText = solved + ' / 669';
      document.getElementById('stat-accuracy').innerText = acc + '%';
    }

    function filterTopic(topic, el) {
      currentTopic = topic;
      var pills = document.querySelectorAll('#topicPills .pill');
      for (var i = 0; i < pills.length; i++) pills[i].classList.remove('active');
      if (el) el.classList.add('active');
      applyFilters();
    }
    function filterYear(year, el) {
      currentYear = year;
      var pills = document.querySelectorAll('#yearPills .pill');
      for (var i = 0; i < pills.length; i++) pills[i].classList.remove('active');
      if (el) el.classList.add('active');
      applyFilters();
    }
    function filterType(type, el) {
      currentType = type;
      var pills = document.querySelectorAll('#typePills .pill');
      for (var i = 0; i < pills.length; i++) pills[i].classList.remove('active');
      if (el) el.classList.add('active');
      applyFilters();
    }
    function toggleRedoMode() {
      redoMode = !redoMode;
      var btn = document.getElementById('redoBtn');
      var banner = document.getElementById('redoBanner');
      if (redoMode) {
        var count = 0;
        for (var i = 0; i < questionsData.length; i++) {
          if (userAnswers[questionsData[i].id] && !userAnswers[questionsData[i].id].isCorrect) count++;
        }
        btn.classList.add('redo-active');
        btn.textContent = 'Redo Active (' + count + ')';
        banner.style.display = 'flex';
        applyFilters();
      } else { exitRedoMode(); }
    }
    function exitRedoMode() {
      redoMode = false;
      var btn = document.getElementById('redoBtn');
      document.getElementById('redoBanner').style.display = 'none';
      btn.classList.remove('redo-active');
      btn.textContent = 'Redo Incorrects';
      applyFilters();
    }

    function renderSidebar(data) {
      var list = document.getElementById('sidebarList');
      list.innerHTML = '';
      for (var i = 0; i < data.length; i++) {
        var q = data[i];
        var li = document.createElement('li');
        li.className = 'sb-item';
        li.setAttribute('data-qid', q.id);
        li.onclick = (function(qid) {
          return function() {
            var el = document.getElementById('q-card-' + qid);
            if (el) el.scrollIntoView({behavior:'smooth',block:'center'});
            if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
          };
        })(q.id);
        var dotColor = 'gray';
        var itemExtra = '';
        if (bookmarks[q.id]) { dotColor = 'amber'; itemExtra = ' bookmarked'; }
        if (userAnswers[q.id]) {
          if (userAnswers[q.id].isCorrect) { dotColor = 'green'; itemExtra = ' answered-correct'; }
          else { dotColor = 'red'; itemExtra = ' answered-incorrect'; }
        }
        li.className = 'sb-item' + itemExtra;
        li.innerHTML = '<span class="sb-dot ' + dotColor + '"></span><span class="sb-num">Q' + q.id + '</span><span class="sb-label">' + q.meta + '</span>';
        list.appendChild(li);
      }
    }
    function updateSidebarItem(qId) {
      var item = document.querySelector('.sb-item[data-qid="' + qId + '"]');
      if (!item) return;
      var dotColor = 'gray';
      var extra = '';
      if (bookmarks[qId]) { dotColor = 'amber'; extra = ' bookmarked'; }
      if (userAnswers[qId]) {
        if (userAnswers[qId].isCorrect) { dotColor = 'green'; extra = ' answered-correct'; }
        else { dotColor = 'red'; extra = ' answered-incorrect'; }
      }
      item.className = 'sb-item' + extra;
      item.querySelector('.sb-dot').className = 'sb-dot ' + dotColor;
    }
    function updateSidebarProgress() {
      var total = questionsData.length;
      var correct = 0, wrong = 0, saved = 0;
      var keys = Object.keys(userAnswers);
      for (var i = 0; i < keys.length; i++) {
        if (userAnswers[keys[i]].isCorrect) correct++; else wrong++;
      }
      var bkeys = Object.keys(bookmarks);
      saved = bkeys.length;
      document.getElementById('sb-total').textContent = total;
      document.getElementById('sb-correct').textContent = correct;
      document.getElementById('sb-wrong').textContent = wrong;
      document.getElementById('sb-bookmarked').textContent = saved;
    }
    function filterSidebar(query) {
      var items = document.querySelectorAll('.sb-item');
      var q = query.toLowerCase();
      for (var i = 0; i < items.length; i++) {
        var text = items[i].textContent.toLowerCase();
        items[i].style.display = text.indexOf(q) !== -1 ? '' : 'none';
      }
    }
    function updateSidebarHighlight() {
      var cards = document.querySelectorAll('.q-card');
      var activeId = null;
      for (var i = 0; i < cards.length; i++) {
        var rect = cards[i].getBoundingClientRect();
        if (rect.top >= -100 && rect.top < window.innerHeight * 0.4) {
          activeId = cards[i].getAttribute('data-qid');
          break;
        }
      }
      var items = document.querySelectorAll('.sb-item');
      for (var j = 0; j < items.length; j++) {
        items[j].classList.remove('active');
        if (activeId && items[j].getAttribute('data-qid') === activeId) {
          items[j].classList.add('active');
          items[j].scrollIntoView({block:'nearest'});
        }
      }
    }
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function toggleGlobalTimer() {
      var btn = document.getElementById('globalTimerBtn');
      if (globalTimerInterval) {
        clearInterval(globalTimerInterval); globalTimerInterval = null;
        btn.innerHTML = '<i class="fa-solid fa-play"></i>'; btn.classList.remove('active');
      } else {
        globalTimerInterval = setInterval(function() {
          globalTimeLeft--;
          var el = document.getElementById('globalTimer');
          var m = Math.floor(globalTimeLeft/60); var s = globalTimeLeft%60;
          el.innerText = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
          el.className = 'timer-display';
          if (globalTimeLeft <= 300) el.classList.add('danger');
          else if (globalTimeLeft <= 600) el.classList.add('warning');
          if (globalTimeLeft <= 0) { clearInterval(globalTimerInterval); globalTimerInterval = null; }
        }, 1000);
        btn.innerHTML = '<i class="fa-solid fa-pause"></i>'; btn.classList.add('active');
      }
    }
    function resetGlobalTimer() {
      if (globalTimerInterval) { clearInterval(globalTimerInterval); globalTimerInterval = null; }
      globalTimeLeft = 2400;
      var el = document.getElementById('globalTimer');
      el.innerText = '40:00'; el.className = 'timer-display';
      var btn = document.getElementById('globalTimerBtn');
      btn.innerHTML = '<i class="fa-solid fa-play"></i>'; btn.classList.remove('active');
    }

    function handleKeyboard(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      var key = e.key.toUpperCase();
      if (['A','B','C','D'].indexOf(key) !== -1) {
        var cards = document.querySelectorAll('.q-card');
        for (var i = 0; i < cards.length; i++) {
          var rect = cards[i].getBoundingClientRect();
          if (rect.top >= -50 && rect.top < window.innerHeight * 0.5) {
            var qId = parseInt(cards[i].getAttribute('data-qid'));
            var btns = cards[i].querySelectorAll('.option-btn');
            for (var j = 0; j < btns.length; j++) {
              if (btns[j].textContent.trim().charAt(0) === key) { btns[j].click(); break; }
            }
            break;
          }
        }
      } else if (key === 'S') {
        var cards2 = document.querySelectorAll('.q-card');
        for (var k = 0; k < cards2.length; k++) {
          var r = cards2[k].getBoundingClientRect();
          if (r.top >= -50 && r.top < window.innerHeight * 0.5) {
            toggleSolution(parseInt(cards2[k].getAttribute('data-qid'))); break;
          }
        }
      } else if (key === 'N' || key === 'ARROWRIGHT') {
        var all = document.querySelectorAll('.q-card');
        for (var m = 0; m < all.length; m++) {
          var qid = parseInt(all[m].getAttribute('data-qid'));
          if (!userAnswers[qid]) { all[m].scrollIntoView({behavior:'smooth',block:'center'}); break; }
        }
      }
    }

    init();
  </script>
</body>
</html>
