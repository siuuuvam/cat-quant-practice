<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAT Quant Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{--bg-primary:#09090b;--bg-elevated:#18181b;--bg-surface:#1c1c21;--bg-muted:#27272a;--border-subtle:rgba(255,255,255,.06);--border-default:rgba(255,255,255,.1);--border-hover:rgba(255,255,255,.16);--accent:#818cf8;--accent-bright:#a5b4fc;--accent-dim:rgba(129,140,248,.12);--text-primary:#fafafa;--text-secondary:#a1a1aa;--text-tertiary:#71717a;--green:#34d399;--green-dim:rgba(52,211,153,.1);--red:#f87171;--red-dim:rgba(248,113,113,.1);--blue:#60a5fa;--amber:#f59e0b;--radius-sm:8px;--radius-md:12px;--radius-lg:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.6;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:800px;height:500px;background:radial-gradient(ellipse,rgba(129,140,248,.08) 0%,transparent 70%);pointer-events:none;z-index:0}
    header{position:sticky;top:0;z-index:100;background:rgba(9,9,11,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border-subtle);padding:0 24px}
    .header-inner{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;height:64px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-logo{width:36px;height:36px;border-radius:var(--radius-sm);background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px}
    .brand-text h1{font-size:15px;font-weight:800;letter-spacing:-.3px}
    .brand-text p{font-size:11px;color:var(--text-tertiary)}
    .timer-wrap{display:flex;align-items:center;gap:10px;background:var(--bg-elevated);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:6px 14px}
    .timer-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-tertiary);font-weight:600}
    .timer-display{font-family:'SF Mono','JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--blue);min-width:52px;text-align:center}
    .timer-display.warning{color:var(--amber)}
    .timer-display.danger{color:var(--red)}
    .timer-btn{background:transparent;border:1px solid var(--border-default);color:var(--text-tertiary);width:28px;height:28px;border-radius:var(--radius-sm);cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .timer-btn:hover{color:var(--text-primary);border-color:var(--border-hover)}
    .timer-btn.active{color:var(--red);border-color:rgba(248,113,113,.3);background:var(--red-dim)}
    .header-stats{display:flex;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:var(--radius-md);overflow:hidden}
    .h-stat{display:flex;flex-direction:column;align-items:center;padding:6px 16px}
    .h-stat+.h-stat{border-left:1px solid var(--border-subtle)}
    .h-stat-val{font-weight:800;font-size:13px;color:var(--accent-bright)}
    .h-stat-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-tertiary);font-weight:600}
    .page-layout{display:flex;max-width:1400px;margin:0 auto;gap:0;min-height:calc(100vh - 64px)}
    .main-content{flex:1;min-width:0;padding:24px 20px}
    .sidebar-toggle{display:none;position:fixed;bottom:20px;right:20px;z-index:200;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:18px;cursor:pointer;box-shadow:0 4px 16px rgba(129,140,248,.4);transition:transform .2s}
    .sidebar-toggle:hover{transform:scale(1.05)}

    .sidebar{width:260px;flex-shrink:0;background:var(--bg-elevated);border-left:1px solid var(--border-subtle);height:calc(100vh - 64px);position:sticky;top:64px;overflow-y:auto;display:flex;flex-direction:column}
    .sidebar::-webkit-scrollbar{width:4px}
    .sidebar::-webkit-scrollbar-thumb{background:var(--bg-muted);border-radius:2px}
    .sb-header{padding:16px 16px 12px;border-bottom:1px solid var(--border-subtle)}
    .sb-title{font-size:13px;font-weight:800;color:var(--text-primary);margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .sb-title i{color:var(--accent);font-size:12px}
    .sb-search{position:relative}
    .sb-search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:11px}
    .sb-search input{width:100%;background:var(--bg-primary);border:1px solid var(--border-default);padding:7px 10px 7px 30px;border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;font-family:inherit;outline:none;transition:border-color .2s}
    .sb-search input:focus{border-color:var(--accent)}
    .sb-progress{padding:10px 16px;border-bottom:1px solid var(--border-subtle);display:flex;gap:12px}
    .sb-prog-item{display:flex;flex-direction:column;align-items:center;flex:1}
    .sb-prog-val{font-size:14px;font-weight:800}
    .sb-prog-val.green{color:var(--green)}
    .sb-prog-val.red{color:var(--red)}
    .sb-prog-val.blue{color:var(--accent-bright)}
    .sb-prog-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-tertiary);font-weight:600}
    .sb-section{padding:12px 16px 4px}
    .sb-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-tertiary);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
    .sb-count{background:var(--bg-muted);padding:1px 6px;border-radius:4px;font-size:10px}
    .sb-list{list-style:none;padding:0 8px 12px}
    .sb-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-secondary);transition:all .12s;border:1px solid transparent;margin-bottom:2px}
    .sb-item:hover{background:var(--bg-muted);color:var(--text-primary)}
    .sb-item.active{background:var(--accent-dim);color:var(--accent-bright);border-color:rgba(129,140,248,.2)}
    .sb-item.answered-correct{border-left:2px solid var(--green)}
    .sb-item.answered-incorrect{border-left:2px solid var(--red)}
    .sb-item.bookmarked{border-left:2px solid var(--amber)}
    .sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .sb-dot.green{background:var(--green)}
    .sb-dot.red{background:var(--red)}
    .sb-dot.amber{background:var(--amber)}
    .sb-dot.gray{background:var(--bg-muted)}
    .sb-num{font-weight:700;font-size:11px;min-width:22px;color:var(--text-tertiary)}
    .sb-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:11px}

    .controls{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;background:var(--bg-elevated);border:1px solid var(--border-subtle);padding:12px 14px;border-radius:var(--radius-lg)}
    .search-box{position:relative;flex:1;min-width:200px}
    .search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:12px}
    .search-input{width:100%;background:var(--bg-primary);border:1px solid var(--border-default);padding:9px 12px 9px 34px;border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-weight:500;font-family:inherit;outline:none;transition:border-color .2s}
    .search-input::placeholder{color:var(--text-tertiary)}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .filter-section{margin-bottom:10px}
    .filter-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-tertiary);margin-bottom:5px}
    .filter-pills{display:flex;gap:4px;flex-wrap:wrap}
    .pill{background:var(--bg-primary);border:1px solid var(--border-default);color:var(--text-secondary);padding:5px 10px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
    .pill:hover{border-color:var(--border-hover);color:var(--text-primary)}
    .pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .pill.redo-active{background:var(--red);color:#fff;border-color:var(--red)}
    .questions-list{display:flex;flex-direction:column;gap:14px}

    .q-card{background:var(--bg-elevated);border:1px solid var(--border-subtle);border-left:3px solid var(--accent);border-radius:var(--radius-lg);padding:0;transition:border-color .25s,box-shadow .25s;position:relative;overflow:hidden;min-height:120px}
    .q-card:hover{border-color:var(--border-hover);box-shadow:0 4px 20px rgba(0,0,0,.2)}
    .q-card.topic-algebra{border-left-color:#818cf8}
    .q-card.topic-arith{border-left-color:#34d399}
    .q-card.topic-ppl{border-left-color:#f59e0b}
    .q-card.topic-tsd{border-left-color:#f87171}
    .q-card .skeleton{background:linear-gradient(90deg,var(--bg-muted) 25%,var(--bg-surface) 50%,var(--bg-muted) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .q-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-subtle);flex-wrap:wrap;gap:6px}
    .q-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .q-number{font-size:11px;font-weight:800;color:var(--text-primary);background:var(--bg-muted);padding:2px 7px;border-radius:4px}
    .q-exam-pill{background:var(--accent-dim);color:var(--accent-bright);font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px}
    .q-type-pill{font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.3px}
    .q-type-pill.mcq{background:rgba(96,165,250,.12);color:var(--blue)}
    .q-type-pill.tita{background:rgba(245,158,11,.12);color:var(--amber)}
    .q-topic-tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;letter-spacing:.2px}
    .q-topic-tag.algebra{background:rgba(129,140,248,.12);color:#a5b4fc}
    .q-topic-tag.arith{background:rgba(52,211,153,.12);color:#6ee7b7}
    .q-topic-tag.ppl{background:rgba(245,158,11,.12);color:#fbbf24}
    .q-topic-tag.tsd{background:rgba(248,113,113,.12);color:#fca5a5}
    .q-actions{display:flex;align-items:center;gap:4px}
    .q-action-btn{background:transparent;border:none;color:var(--text-tertiary);cursor:pointer;font-size:13px;padding:4px;border-radius:4px;display:flex;align-items:center;transition:all .15s}
    .q-action-btn:hover{color:var(--text-primary);background:var(--bg-muted)}
    .q-action-btn.bookmarked{color:var(--amber)}
    .q-timer-box{display:flex;align-items:center;gap:4px;background:var(--bg-primary);border:1px solid var(--border-default);padding:3px 6px;border-radius:var(--radius-sm)}
    .timer-sm{font-family:monospace;font-size:11px;font-weight:700;color:var(--blue);min-width:36px;text-align:center}
    .timer-btn-sm{background:transparent;border:none;color:var(--text-tertiary);cursor:pointer;font-size:10px;padding:2px;display:flex;align-items:center}
    .timer-btn-sm:hover{color:var(--text-primary)}
    .timer-btn-sm.active{color:var(--red)}
    .q-body{padding:14px 16px;font-size:13px;color:var(--text-secondary);line-height:1.7}
    .q-body p{font-weight:500}
    .q-body img{max-width:100%;height:auto;border-radius:var(--radius-sm);margin-top:6px;border:1px solid var(--border-subtle)}
    .img-fallback{padding:8px;background:rgba(245,158,11,.08);border:1px dashed rgba(245,158,11,.3);border-radius:6px;color:var(--amber);font-size:11px;text-align:center;margin:4px 0}
    .options-grid{display:grid;grid-template-columns:1fr;gap:5px;padding:0 16px 12px}
    @media(min-width:768px){.options-grid{grid-template-columns:1fr 1fr}}
    .option-btn{background:var(--bg-primary);border:1px solid var(--border-default);border-radius:var(--radius-sm);padding:8px 10px;text-align:left;color:var(--text-secondary);font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between;gap:5px}
    .option-btn:hover:not(.disabled):not(.correct-choice):not(.incorrect-choice){border-color:var(--accent);color:var(--text-primary)}
    .option-btn.correct-choice{background:var(--green-dim)!important;border-color:rgba(52,211,153,.3)!important;color:var(--green)!important;font-weight:600}
    .option-btn.incorrect-choice{background:var(--red-dim)!important;border-color:rgba(248,113,113,.3)!important;color:var(--red)!important}
    .option-btn.disabled{opacity:.45;cursor:default}
    .option-btn i{font-size:11px;flex-shrink:0}
    .tita-wrap{display:flex;gap:6px;max-width:340px;padding:0 16px 12px}
    .tita-input{flex:1;background:var(--bg-primary);border:1px solid var(--border-default);padding:7px 10px;border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;font-family:inherit;outline:none}
    .tita-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
    .submit-btn{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:var(--radius-sm);font-weight:700;font-size:11px;font-family:inherit;cursor:pointer}
    .submit-btn:hover{background:#6366f1}
    .q-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--border-subtle);background:rgba(0,0,0,.1)}
    .q-footer-left{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .btn-sm{background:transparent;border:1px solid var(--border-default);color:var(--text-tertiary);padding:4px 10px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
    .btn-sm:hover{color:var(--text-primary);border-color:var(--border-hover)}
    .btn-sm.redo-btn{border-color:rgba(248,113,113,.25);color:var(--red)}
    .btn-sm.redo-btn:hover{background:var(--red-dim);border-color:rgba(248,113,113,.4)}
    .btn-sm.copy-btn{border-color:rgba(96,165,250,.25);color:var(--blue)}
    .btn-sm.copy-btn:hover{background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.4)}
    .btn-sm.copy-btn.copied{color:var(--green);border-color:rgba(52,211,153,.3)}
    .solution-box{display:none;margin:0 16px 12px;background:rgba(129,140,248,.04);border:1px solid rgba(129,140,248,.12);border-radius:var(--radius-md);padding:12px 14px;font-size:12px;color:var(--text-secondary);line-height:1.7}
    .solution-box.show{display:block}
    .solution-box strong{color:var(--accent-bright)}
    .status-badge{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
    .status-badge.correct{color:var(--green)}
    .status-badge.incorrect{color:var(--red)}
    .redo-banner{background:var(--red-dim);border:1px solid rgba(248,113,113,.2);border-radius:var(--radius-sm);padding:8px 14px;font-size:12px;color:var(--red);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--bg-muted);border-radius:3px}
    @media(max-width:768px){
      .header-inner{height:auto;padding:10px 0}
      .timer-wrap{order:3;width:100%;justify-content:center}
      .header-stats{width:100%;justify-content:center}
      .controls{flex-direction:column;align-items:stretch;padding:10px}
      .filter-pills{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:4px}
      .q-header{padding:10px 12px}
      .q-body{padding:10px 12px;font-size:12px}
      .options-grid{padding:0 12px 10px;gap:4px}
      .option-btn{padding:7px 8px;font-size:11px}
      .tita-wrap{padding:0 12px 10px}
      .q-footer{padding:8px 12px;flex-wrap:wrap;gap:6px}
      .q-footer-left{gap:4px}
      .btn-sm{padding:4px 8px;font-size:10px}
      .sidebar{display:none;position:fixed;top:64px;right:0;bottom:0;width:280px;z-index:150;background:var(--bg-elevated);border-left:1px solid var(--border-subtle);box-shadow:-4px 0 20px rgba(0,0,0,.3)}
      .sidebar.open{display:flex}
      .sidebar-toggle{display:flex;align-items:center;justify-content:center}
      .q-topic-tag{font-size:8px;padding:1px 4px}
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <div class="brand-text">
          <h1>CAT Quant Practice</h1>
          <p>669 Questions &middot; Past Papers</p>
        </div>
      </div>
      <div class="timer-wrap">
        <span class="timer-label">Section</span>
        <span class="timer-display" id="globalTimer">40:00</span>
        <button class="timer-btn" id="globalTimerBtn" onclick="toggleGlobalTimer()"><i class="fa-solid fa-play"></i></button>
        <button class="timer-btn" onclick="resetGlobalTimer()"><i class="fa-solid fa-rotate-right"></i></button>
      </div>
      <div class="header-stats">
        <div class="h-stat"><span class="h-stat-val" id="stat-solved">0 / 669</span><span class="h-stat-lbl">Solved</span></div>
        <div class="h-stat"><span class="h-stat-val" id="stat-accuracy">0%</span><span class="h-stat-lbl">Acc</span></div>
      </div>
    </div>
  </header>

  <div class="page-layout">
    <div class="main-content">
      <div class="controls">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search questions, CAT year, topic...">
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Topic</div>
        <div class="filter-pills" id="topicPills">
          <button class="pill active" onclick="filterTopic('all',this)">All (669)</button>
        <button class="pill" onclick="filterTopic('Algebra',this)">Algebra (306)</button>
        <button class="pill" onclick="filterTopic('Averages, Ratio & Proportion',this)">Averages (97)</button>
        <button class="pill" onclick="filterTopic('Percentage, Profit & Loss',this)">Percentage (114)</button>
        <button class="pill" onclick="filterTopic('Time, Speed, Distance & Work',this)">Time (152)</button>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Year</div>
        <div class="filter-pills" id="yearPills">
          <button class="pill active" onclick="filterYear('all',this)">All</button>
          <button class="pill" onclick="filterYear('2024',this)">2024 (50)</button>
        <button class="pill" onclick="filterYear('2023',this)">2023 (54)</button>
        <button class="pill" onclick="filterYear('2022',this)">2022 (56)</button>
        <button class="pill" onclick="filterYear('2021',this)">2021 (47)</button>
        <button class="pill" onclick="filterYear('2020',this)">2020 (46)</button>
        <button class="pill" onclick="filterYear('2019',this)">2019 (40)</button>
        <button class="pill" onclick="filterYear('2018',this)">2018 (36)</button>
        <button class="pill" onclick="filterYear('2017',this)">2017 (42)</button>
        <button class="pill" onclick="filterYear('2008',this)">2008 (6)</button>
        <button class="pill" onclick="filterYear('2007',this)">2007 (12)</button>
        <button class="pill" onclick="filterYear('2006',this)">2006 (9)</button>
        <button class="pill" onclick="filterYear('2005',this)">2005 (8)</button>
        <button class="pill" onclick="filterYear('2004',this)">2004 (18)</button>
        <button class="pill" onclick="filterYear('2003',this)">2003 (41)</button>
        <button class="pill" onclick="filterYear('2002',this)">2002 (27)</button>
        <button class="pill" onclick="filterYear('2001',this)">2001 (27)</button>
        <button class="pill" onclick="filterYear('2000',this)">2000 (27)</button>
        <button class="pill" onclick="filterYear('1999',this)">1999 (25)</button>
        <button class="pill" onclick="filterYear('1998',this)">1998 (17)</button>
        <button class="pill" onclick="filterYear('1997',this)">1997 (18)</button>
        <button class="pill" onclick="filterYear('1996',this)">1996 (19)</button>
        <button class="pill" onclick="filterYear('1995',this)">1995 (16)</button>
        <button class="pill" onclick="filterYear('1994',this)">1994 (28)</button>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-label">Type & Status</div>
        <div class="filter-pills" id="typePills">
          <button class="pill active" onclick="filterType('all',this)">All</button>
          <button class="pill" onclick="filterType('mcq',this)">MCQ</button>
          <button class="pill" onclick="filterType('tita',this)">TITA</button>
          <button class="pill" onclick="filterType('unsolved',this)">Unsolved</button>
          <button class="pill" onclick="filterType('solved',this)">Solved</button>
          <button class="pill" onclick="filterType('correct',this)">Correct</button>
          <button class="pill" onclick="filterType('incorrect',this)">Incorrect</button>

{id:259,origId:259,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2002",text:"Amol was asked to calculate the arithmetic mean of ten positive integers each of which had two digits. By mistake, he interchanged the two digits, say a and b, in one of these ten integers. As a result, his answer for the arithmetic mean was 1.8 more than what it should have been. Then b – a equals",options:["A : 1","B : 2","C : 3","D : None of these"],correct:"B"},
{id:260,origId:260,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2002",text:"A child was asked to add first few natural numbers (that is, 1 + 2 + 3 + .....) so long his patience permitted. As he stopped he gave the sum as 575. When the teacher declared the result wrong the child discovered he had missed one number in the sequence during addition. The number he missed was",options:["A : less than 10","B : 10","C : 15","D : more than 15"],correct:"D"},
{id:261,origId:261,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2002",text:"<img src='images/images_question_images_2917_question_TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : <img src='images/images_question_images_2917_answer_10930_rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>","B : <img src='images/images_question_images_2917_answer_10931_RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>","C : <img src='images/images_question_images_2917_answer_10932_TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>","D : <img src='images/images_question_images_2917_answer_10933_TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>"],correct:"B"},
{id:262,origId:262,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"If x > 5 and y < – 1, then which of the following statements is true?",options:["A : (x + 4y) > 1","B : x > – 4y","C : – 4x < 5y","D : None of these"],correct:"D"},
{id:263,origId:263,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"Two men X and Y started working for a certain company at similar jobs on January 1, 1950. X asked for an initial salary of Rs 300 with an annual increment of Rs 30. Y asked for an initial salary of Rs 200 with a rise of Rs 15 every six months. Assume that the arrangements remained unaltered till December 31, 1959. Salary is paid on the last day of the month. What is the total amount paid to them as salary during the period?",options:["A : Rs 93,300","B : Rs 93,200","C : Rs 93,100","D : None of these"],correct:"A"},
{id:264,origId:264,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"x and y are real numbers satisfying the conditions 2 < x < 3 and – 8 < y < – 7. Which of the following expressions will have the least value?",options:["A : x²y","B : xy²","C : 5xy","D : None of these"],correct:"B"},
{id:265,origId:265,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"m is the smallest positive integer such that for any integer n ≤ m , the quantity n³ - 7n² + 11n - 5 is positive. What is the value of m?",options:["A : 4","B : 5","C : 6","D : None of these"],correct:"D"},
{id:266,origId:266,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"Let x, y be two positive numbers such that x + y = 1. Then, the minimum value of <img src='images/images_question_images_2432_question_RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 12","B : 20","C : 12.5","D : 13.3"],correct:"C"},
{id:267,origId:267,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"Let b be a positive integer and a = b² – b. If b ≤ 4, then a² – 2a is divisible by",options:["A : 15","B : 20","C : 24","D : none of these"],correct:"C"},
{id:268,origId:268,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"Ujakar and Keshab solve a quadratic equation. Ujakar made a mistake in writing down the constant term. He ended up with the roots (4, 3). Keshab made a mistake in writing down the coefficient of x. He got the roots as (3, 2). What will be the exact roots of the original quadratic equation?",options:["A : (6, 1)","B : (– 3, – 4)","C : (4, 3)","D : (– 4, – 3)"],correct:"A"},
{id:269,origId:269,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"Based on the information provided which of the following is true?",options:["A : <img src='images/images_question_images_2435_answer_9374_rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>","B : <img src='images/images_question_images_2435_answer_9375_rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>","C : <img src='images/images_question_images_2435_answer_9376_TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>","D : None of these"],correct:"D"},
{id:270,origId:270,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"An experienced cricketer with no incomplete innings has a BA of 50. The next time he bats, the innings is incomplete and he scores 45 runs. It can be inferred that",options:["A : BA and MB A 1 will both increase","B : BA will increase and MB A 2 will decrease","C : BA will increase and not enough data is available to assess change in MB A 1 and MB A 2","D : None of these"],correct:"B"},
{id:271,origId:271,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"All the page numbers from a book are added, beginning at page 1. However, one page number was mistakenly added twice. The sum obtained was 1000. Which page number was added twice?",options:["A : 44","B : 45","C : 10","D : 12"],correct:"C"},
{id:272,origId:272,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"If a, b, c and d are four positive real numbers such that abcd = 1 , what is the minimum value of (1 + a) (1 + b) (1 + c) (1 + d)?",options:["A : 4","B : 1","C : 16","D : 18"],correct:"C"},
{id:273,origId:273,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2001",text:"For a Fibonacci sequence, from the third term onwards, each term in the sequence is the sum of the previous two terms in that sequence. If the difference in squares of seventh and sixth terms of this sequence is 517, what is the tenth term of this sequence?",options:["A : 147","B : 76","C : 123","D : Cannot be determined"],correct:"C"},
{id:274,origId:274,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2000",text:"x > 2, y > 1 then which of the following holds good ?",options:["A : xy > -2","B : xy < -2","C : x > -2/y","D : None of these"],correct:"D"},
{id:275,origId:275,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2000",text:"A, B and C are 3 cities that form a triangle and where every city is connected to every other one by at least one direct roots. There are 33 routes direct & indirect from A to C and there are 23 direct routes from B to A. How many direct routes are there from A to C ?",options:["A : 15","B : 10","C : 20","D : 25"],correct:"B"},
{id:276,origId:276,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2000",text:"If the equation x³ - ax² + bx - a = 0 has three real roots then which of the following is true?",options:["A : a = 11","B : a ≠ 1","C : b = 1","D : b ≠ 1"],correct:"D"},
{id:277,origId:277,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2000",text:"<img src='images/images_question_images_2427_question_RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 0.6","B : 0.2","C : 0.36","D : 0.4"],correct:"D"},
{id:278,origId:278,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2000",text:"<img src='images/images_question_images_2908_question_rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 9/10","B : 10/11","C : 19/21","D : 10/21"],correct:"D"},
{id:279,origId:279,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"2000",text:"<img src='images/images_question_images_2909_question_rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 5 × 2 99 + 6","B : 5 × 2 99 - 6","C : 6 × 2 99 + 5","D : 6 × 2 99 - 5"],correct:"D"},
{id:280,origId:280,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"| r - 6 |=11 and | 2q - 12 |= 8, then what is the minimum value of q / r?",options:["A : -2","B : 17/10","C : -1/5","D : 2/5"],correct:"A"},
{id:281,origId:281,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"The expenses of a boarding school depends upon the fixed cost and variable cost. Variable cost varies directly as the number of students. If the expenses per student were Rs 600 for 50 students and Rs 700 for 25 students then what are the expenses for 100 students?",options:["A : 50000","B : 60000","C : 57500","D : 55000"],correct:"D"},
{id:282,origId:282,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"All values in S1 are changed in sign, while those in S2 remain unchanged. Which of the following statements is true?",options:["A : Every member of S1 is greater than or equal to every member of S2.","B : G is in S1.","C : If all numbers originally in S1 and S2 had the same sign, then after the change of sign, the largest number of S1 and S2 is in S1","D : None of the above"],correct:"D"},
{id:283,origId:283,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"Elements of S1 are in ascending order, and those of S2 are in descending order. a 24 and a 25 are interchanged then which of the following statements is true",options:["A : S1 continues to be in ascending order","B : S2 continues to be in descending order.","C : S1 continues to be in ascending order and S2 in descending order.","D : None of the above"],correct:"A"},
{id:284,origId:284,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"There are fifty integers a 1 , a 2 , ....... a 50 , not all of them necessarily different. Let the greatest integer of these fifty integers be referred to as G, and the smallest integer be referred to as L. The integers a 1 through a 24 form sequence S1, and the rest form sequence S2. Each member of S1 is less than or equal to each member of S2. Every element of S1 is made greater than or equal to every element of S2 by adding to each element of S1an integer x.Then x cannot be less than",options:["A : 2 10","B : (G – L)","C : The smallest value of S2","D : The largest value of S2"],correct:"B"},
{id:285,origId:285,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"What is the maximum possible value of m?",options:["A : 7","B : 8","C : 9","D : 10"],correct:"D"},
{id:286,origId:286,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"If m is maximum then what is the minimum number of white vessels required to empty it?",options:["A : 7","B : 6","C : 5","D : 8"],correct:"D"},
{id:287,origId:287,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1999",text:"If m is maximum then what is range of the volume remaining empty in the vessel with the maximum empty space?",options:["A : 0.45 – 0.55","B : 0.55 – 0.65","C : 0.1 – 0.75","D : 0.75 – 0.85"],correct:"C"},
{id:288,origId:288,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1998",text:"One year payment to a servant is Rs 90 plus one turban. The servant leaves after 9 months and receives Rs 65 and a turban. Then find the price of the turban",options:["A : Rs 10","B : Rs 15","C : Rs 7.5","D : Cannot be determined"],correct:"A"},
{id:289,origId:289,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1998",text:"You can collect Rubies and Emeralds as many as you can. Each Ruby is worth Rs 4crores and each Emerald is worth of Rs 5crore. Each Ruby weights 0.3 kg. and each Emerald weighs 0.4 kg. Your bag can carry at the most 12 kg. What you should collect to get the maximum wealth?",options:["A : 20 Rubies and 15 Emeralds","B : 40 Rubies","C : 28 Rubies and 9 Emeralds","D : None of these"],correct:"B"},
{id:290,origId:290,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1997",text:"If the roots, x 1 and x 2 , of the quadratic equation x² – 2x + c = 0 also satisfy the equation 7x ² – 4x 1 = 47, then which of the following is true?",options:["A : c = – 15","B : x 1 = –5, x 2 = 3","C : x 1 = 4.5, x 2 = -2.5","D : None of these"],correct:"A"},
{id:291,origId:291,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1997",text:"If log 2 [log 7 (x² – x + 37)] = 1, then what could be the value of x?",options:["A : 3","B : 5","C : 4","D : None of these"],correct:"C"},
{id:292,origId:292,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1996",text:"Once I had been to the post-office to buy stamps of five rupees, two rupees and one rupee. I paid the clerk Rs 20, and since he did not have change, he gave me three more stamps of one rupee. If the number of stamps of each type that I had ordered initially was more than one, what was the total number of stamps that I bought?",options:["A : 10","B : 9","C : 12","D : 8"],correct:"A"},
{id:293,origId:293,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1996",text:"Given the quadratic equation x² – (A – 3)x – (A – 7), for what value of A will the sum of the squares of the roots be zero?",options:["A : -2","B : 3","C : 6","D : None of these"],correct:"D"},
{id:294,origId:294,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1996",text:"Which of the following values of x do not satisfy the inequality (x² - 3x + 2 > 0) at all?",options:["A : 1≤ x ≤ 2","B : -1 ≥ x ≥ -2","C : 0 ≤ x ≤ 2","D : 0 ≥ x ≥ -2"],correct:"A"},
{id:295,origId:295,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1996",text:"Out of two-thirds of the total number of basket-ball matches, a team has won 17 matches and lost 3 of them. what is the maximum number of matches that the team can lose and still win three-fourths of the total number of matches, if it is true that no match can end in a tie ?",options:["A : 4","B : 6","C : 5","D : 3"],correct:"A"},
{id:296,origId:296,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1995",text:"What is the value of m which satisfies 3m² – 21m + 30 < 0 ?",options:["A : m < 2 or m > 5","B : m > 2","C : 2 < m < 5","D : m < 5"],correct:"C"},
{id:297,origId:297,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1995",text:"<img src='images/images_question_images_80_question_rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 100","B : 105","C : 125","D : 75"],correct:"A"},
{id:298,origId:298,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1995",text:"One root of x² + kx – 8 = 0 is square of the other. Then the value of k is",options:["A : 2","B : 8","C : -8","D : -2"],correct:"D"},
{id:299,origId:299,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"<img src='images/images_question_images_76_question_RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 0","B : 1","C : -1","D : abc"],correct:"B"},
{id:300,origId:300,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"<img src='images/images_question_images_77_question_TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 49/4","B : 4/49","C : 4","D : 1/4"],correct:"A"},
{id:301,origId:301,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"Nineteen years from now Jackson will be 3 times as old as Joseph is now. Joseph is three years younger than Jackson. I. Johnson’s age now II. Joseph’s age now",options:["A : I > II","B : I < II","C : I = II","D : Nothing can be said"],correct:"D"},
{id:302,origId:302,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"log 216√6 to the base 6 is",options:["A : 3","B : 3/2","C : 7/2","D : None of these"],correct:"C"},
{id:303,origId:303,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"If log 7 log 5 (√x + 5 + √x ) = 0 , find the value of x.",options:["A : 1","B : 0","C : 2","D : None of these"],correct:"B"},
{id:304,origId:304,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"If the harmonic mean between two positive numbers is to their geometric mean as 12 : 13; then the numbers could be in the ratio",options:["A : 12 : 13","B : 1/12 : 1/13","C : 4 : 9","D : 2 : 3"],correct:"C"},
{id:305,origId:305,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"Fourth term of an arithmatic progression is 8. What is the sum of the first 7 terms of the arithmatic progression?",options:["A : 7","B : 64","C : 56","D : Can’t be determined"],correct:"C"},
{id:306,origId:306,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Algebra",year:"1994",text:"Along a road lie an odd number of stones placed at intervals of 10 m. These stones have to be assembled around the middle stone. A person can carry only one stone at a time. A man carried out the job starting with the stone in the middle, carrying stones in succession, thereby covering a distance of 4.8 km. Then the number of stones is",options:["A : 35","B : 15","C : 29","D : 31"],correct:"D"},
{id:307,origId:1,meta:"CAT/2024.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2024",text:"In a group of 250 students, the percentage of girls was at least 44% and at most 60%. The rest of the students were boys. Each student opted for either swimming or running or both. If 50% of the boys and 80% of the girls opted for swimming while 70% of the boys and 60% of the girls opted for running, then the minimum and maximum possible number of students who opted for both swimming and running, are",options:["A : 72 and 80, respectively","B : 75 and 90, respectively","C : 72 and 88, respectively","D : 75 and 96, respectively"],correct:"A"},
{id:308,origId:2,meta:"CAT/2024.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2024",text:"After two successive increments, Gopal's salary became 187.5% of his initial salary. If the percentage of salary increase in the second increment was twice of that in the first increment, then the percentage of salary increase in the first increment was",options:["A : 27.5","B : 30","C : 25","D : 20"],correct:"C"},
{id:309,origId:3,meta:"CAT/2024.3(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2024",text:"A certain amount of water was poured into a 300 litre container and the remaining portion of the container was filled with milk. Then an amount of this solution was taken out from the container which was twice the volume of water that was earlier poured into it, and water was poured to refill the container again. If the resulting solution contains 72% milk, then the amount of water, in litres, that was initially poured into the container was",options:null,correct:"30"},
{id:310,origId:4,meta:"CAT/2024.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2024",text:"Rajesh and Vimal own 20 hectares and 30 hectares of agricultural land, respectively, which are entirely covered by wheat and mustard crops. The cultivation area of wheat and mustard in the land owned by Vimal are in the ratio of 5 : 3. If the total cultivation area of wheat and mustard are in the ratio 11 : 9, then the ratio of cultivation area of wheat and mustard in the land owned by Rajesh is",options:["A : 1:1","B : 7:9","C : 4:3","D : 3:7"],correct:"B"},
{id:311,origId:5,meta:"CAT/2024.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2024",text:"A fruit seller has a total of 187 fruits consisting of apples, mangoes and oranges. The number of apples and mangoes are in the ratio 5 : 2. After she sells 75 apples, 26 mangoes and half of the oranges, the ratio of number of unsold apples to number of unsold oranges becomes 3 : 2. The total number of unsold fruits is",options:null,correct:"66"},
{id:312,origId:6,meta:"CAT/2024.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2024",text:"In September, the incomes of Kamal, Amal and Vimal are in the ratio 8 : 6 : 5. They rent a house together, and Kamal pays 15%, Amal pays 12% and Vimal pays 18% of their respective incomes to cover the total house rent in that month. In October, the house rent remains unchanged while their incomes increase by 10%, 12% and 15%, respectively. In October, the percentage of their total income that will be paid as house rent, is nearest to",options:["A : 15.18","B : 13.26","C : 14.84","D : 12.75"],correct:"B"},
{id:313,origId:7,meta:"CAT/2024.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2024",text:"There are four numbers such that average of first two numbers is 1 more than the first number, average of first three numbers is 2 more than average of first two numbers, and average of first four numbers is 3 more than average of first three numbers. Then, the difference between the largest and the smallest numbers, is",options:null,correct:"15"},
{id:314,origId:8,meta:"CAT/2024.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2024",text:"A glass is filled with milk. Two-thirds of its content is poured out and replaced with water. If this process of pouring out two-thirds the content and replacing with water is repeated three more times, then the final ratio of milk to water in the glass, is",options:["A : 1 : 27","B : 1 : 80","C : 1 : 81","D : 1 : 26"],correct:"B"},
{id:315,origId:9,meta:"CAT/2023.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2023",text:"Anil mixes cocoa with sugar in the ratio 3 : 2 to prepare mixture A, and coffee with sugar in the ratio 7 : 3 to prepare mixture B. He combines mixtures A and B in the ratio 2 : 3 to make a new mixture C. If he mixes C with an equal amount of milk to make a drink, then the percentage of sugar in this drink will be",options:["A : 16","B : 17","C : 24","D : 21"],correct:"B"},
{id:316,origId:10,meta:"CAT/2023.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2023",text:"<img src='images/images_question_images_4421_question_11TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 1.5","B : 1","C : 0.5","D : 2"],correct:"B"},
{id:317,origId:11,meta:"CAT/2023.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2023",text:"The price of a precious stone is directly proportional to the square of its weight. Sita has a precious stone weighing 18 units. If she breaks it into four pieces with each piece having distinct integer weight, then the difference between the highest and lowest possible values of the total price of the four pieces will be 288000. Then, the price of the original precious stone is",options:["A : 1620000","B : 1944000","C : 1296000","D : 972000"],correct:"C"},
{id:318,origId:12,meta:"CAT/2023.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2023",text:"In a company, 20% of the employees work in the manufacturing department. If the total salary obtained by all the manufacturing employees is one-sixth of the total salary obtained by all the employees in the company, then the ratio of the average salary obtained by the manufacturing employees to the average salary obtained by the nonmanufacturing employees is",options:["A : 5 : 4","B : 6 : 5","C : 4 : 5","D : 5 : 6"],correct:"C"},
{id:319,origId:13,meta:"CAT/2023.2(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2023",text:"A container has 40 liters of milk. Then, 4 liters are removed from the container and replaced with 4 liters of water. This process of replacing 4 liters of the liquid in the container with an equal volume of water is continued repeatedly. The smallest number of times of doing this process, after which the volume of milk in the container becomes less than that of water, is",options:null,correct:"7"},
{id:320,origId:14,meta:"CAT/2023.2(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2023",text:"<img src='images/images_question_images_4350_question_1TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:null,correct:"16"},
{id:321,origId:15,meta:"CAT/2023.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2023",text:"In an examination, the average marks of 4 girls and 6 boys is 24. Each of the girls has the same marks while each of the boys has the same marks. If the marks of any girl is at most double the marks of any boy, but not less than the marks of any boy, then the number of possible distinct integer values of the total marks of 2 girls and 6 boys is",options:["A : 19","B : 22","C : 20","D : 21"],correct:"D"},
{id:322,origId:16,meta:"CAT/2023.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2023",text:"Anil invests Rs. 22000 for 6 years in a certain scheme with 4% interest per annum, compounded half-yearly. Sunil invests in the same scheme for 5 years, and then reinvests the entire amount received at the end of 5 years for one year at 10% simple interest. If the amounts received by both at the end of 6 years are same, then the initial investment made by Sunil, in rupees, is",options:null,correct:"20808"},
{id:323,origId:17,meta:"CAT/2023.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2023",text:"A mixture P is formed by removing a certain amount of coffee from a coffee jar and replacing the same amount with cocoa powder. The same amount is again removed from mixture P and replaced with same amount of cocoa powder to form a new mixture Q. If the ratio of coffee and cocoa in the mixture Q is 16 : 9, then the ratio of cocoa in mixture P to that in mixture Q is",options:["A : 5 : 9","B : 1 : 3","C : 1 : 2","D : 4 : 9"],correct:"A"},
{id:324,origId:18,meta:"CAT/2022.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2022",text:"A glass contains 500 cc of milk and a cup contains 500 cc of water. From the glass, 150 cc of milk is transferred to the cup and mixed thoroughly. Next, 150 cc of this mixture is transferred from the cup to the glass. Now, the amount of water in the glass and the amount of milk in the cup are in the ratio",options:["A : 10 : 3","B : 10 : 13","C : 3 : 10","D : 1 : 1"],correct:"D"},
{id:325,origId:19,meta:"CAT/2022.3(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2022",text:"A school has less than 5000 students and if the students are divided equally into teams of either 9 or 10 or 12 or 25 each, exactly 4 are always left out. However, if they are divided into teams of 11 each, no one is left out. The maximum number of teams of 12 each that can be formed out of the students in the school is",options:null,correct:"150"},
{id:326,origId:20,meta:"CAT/2022.3(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2022",text:"In an examination, the average marks of students in sections A and B are 32 and 60, respectively. The number of students in section A is 10 less than that in section B. If the average marks of all the students across both the sections combined is an integer, then the difference between the maximum and minimum possible number of students in section A is",options:null,correct:"63"},
{id:327,origId:21,meta:"CAT/2022.3(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2022",text:"Consider six distinct natural numbers such that the average of the two smallest numbers is 14, and the average of the two largest numbers is 28. Then, the maximum possible value of the average of these six numbers is",options:null,correct:"63"},
{id:328,origId:22,meta:"CAT/2022.2(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2022",text:"In an examination, there were 75 questions. 3 marks were awarded for each correct answer, 1 mark was deducted for each wrong answer and 1 mark was awarded for each unattempted question. Rayan scored a total of 97 marks in the examination. If the number of unattempted questions was higher than the number of attempted questions, then the maximum number of correct answers that Rayan could have given in the examination is",options:null,correct:"24"},
{id:329,origId:23,meta:"CAT/2022.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2022",text:"Five students, including Amit, appear for an examination in which possible marks are integers between 0 and 50, both inclusive. The average marks for all the students is 38 and exactly three students got more than 32. If no two students got the same marks and Amit got the least marks among the five students, then the difference between the highest and lowest possible marks of Amit is",options:["A : 22","B : 21","C : 20","D : 24"],correct:"C"},
{id:330,origId:24,meta:"CAT/2022.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2022",text:"There are two containers of the same volume, first container half-filled with sugar syrup and the second container half-filled with milk. Half the content of the first container is transferred to the second container, and then the half of this mixture is transferred back to the first container. Next, half the content of the first container is transferred back to the second container. Then the ratio of sugar syrup and milk in the second container is",options:["A : 5 : 6","B : 4 : 5","C : 6 : 5","D : 5 : 4"],correct:"A"},
{id:331,origId:25,meta:"CAT/2022.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2022",text:"Pinky is standing in a queue at a ticket counter. Suppose the ratio of the number of persons standing ahead of Pinky to the number of persons standing behind her in the queue is 3 : 5. If the total number of persons in the queue is less than 300, then the maximum possible number of persons standing ahead of Pinky is",options:null,correct:"111"},
{id:332,origId:26,meta:"CAT/2022.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2022",text:"In a village, the ratio of number of males to females is 5 : 4. The ratio of number of literate males to literate females is 2 : 3. The ratio of the number of illiterate males to illiterate females is 4 : 3. If 3600 males in the village are literate, then the total number of females in the village is",options:null,correct:"43200"},
{id:333,origId:27,meta:"CAT/2022.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2022",text:"<img src='images/images_question_images_4125_question_1RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 4","B : 5","C : 3","D : 1"],correct:"B"},
{id:334,origId:28,meta:"CAT/2022.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2022",text:"A mixture contains lemon juice and sugar syrup in equal proportion. If a new mixture is created by adding this mixture and sugar syrup in the ratio 1 : 3, then the ratio of lemon juice and sugar syrup in the new mixture is",options:["A : 1 : 6","B : 1 : 5","C : 1 : 4","D : 1 : 7"],correct:"D"},
{id:335,origId:29,meta:"CAT/2022.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2022",text:"The average weight of students in a class increases by 600 gm when some new students join the class. If the average weight of the new students is 3 kg more than the average weight of the original students, then the ratio of the number of original students to the number of new students is",options:["A : 1 : 4","B : 1 : 2","C : 3 : 1","D : 4 : 1"],correct:"D"},
{id:336,origId:30,meta:"CAT/2021.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2021",text:"Onion is sold for 5 consecutive months at the rate of Rs 10, 20, 25, 25, and 50 per kg, respectively. A family spends a fixed amount of money on onion for each of the first three months, and then spends half that amount on onion for each of the next two months. The average expense for onion, in rupees per kg, for the family over these 5 months is closest to",options:["A : 26","B : 16","C : 20","D : 18"],correct:"D"},
{id:337,origId:31,meta:"CAT/2021.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2021",text:"Suppose hospital A admitted 21 less Covid infected patients than hospital B, and all eventually recovered. The sum of recovery days for patients in hospitals A and B were 200 and 152, respectively. If the average recovery days for patients admitted in hospital A was 3 more than the average in hospital B then the number admitted in hospital A was",options:null,correct:"35"},
{id:338,origId:32,meta:"CAT/2021.2(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2021",text:"From a container filled with milk, 9 litres of milk are drawn and replaced with water. Next, from the same container, 9 litres are drawn and again replaced with water. If the volumes of milk and water in the container are now in the ratio of 16 : 9, then the capacity of the container, in litres, is ?",options:null,correct:"45"},
{id:339,origId:33,meta:"CAT/2021.2(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2021",text:"In a football tournament, a player has played a certain number of matches and 10 more matches are to be played. If he scores a total of one goal over the next 10 matches, his overall average will be 0.15 goals per match. On the other hand, if he scores a total of two goals over the next 10 matches, his overall average will be 0.2 goals per match. The number of matches he has played is",options:null,correct:"10"},
{id:340,origId:34,meta:"CAT/2021.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2021",text:"The total of male and female populations in a city increased by 25% from 1970 to 1980. During the same period, the male population increased by 40% while the female population increased by 20%. From 1980 to 1990, the female population increased by 25%. In 1990, if the female population is twice the male population, then the percentage increase in the total of male and female populations in the city from 1970 to 1990 is",options:["A : 68.25","B : 68.75","C : 68.50","D : 69.25"],correct:"B"},
{id:341,origId:35,meta:"CAT/2021.3(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2021",text:"A tea shop offers tea in cups of three different sizes. The product of the prices, in INR, of three different sizes is equal to 800. The prices of the smallest size and the medium size are in the ratio 2 : 5. If the shop owner decides to increase the prices of the smallest and the medium ones by INR 6 keeping the price of the largest size unchanged, the product then changes to 3200. The sum of the original prices of three different sizes, in INR, is ?",options:null,correct:"34"},
{id:342,origId:36,meta:"CAT/2021.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2021",text:"If a certain weight of an alloy of silver and copper is mixed with 3 kg of pure silver, the resulting alloy will have 90% silver by weight. If the same weight of the initial alloy is mixed with 2 kg of another alloy which has 90% silver by weight, the resulting alloy will have 84% silver by weight. Then, the weight of the initial alloy, in kg, is",options:["A : 3","B : 4","C : 2.5","D : 3.5"],correct:"A"},
{id:343,origId:37,meta:"CAT/2020.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2020",text:"Let A, B and C be three positive integers such that the sum of A and the mean of B and C is 5. In addition, the sum of B and the mean of A and C is 7. Then the sum of A and B is",options:["A : 6","B : 4","C : 7","D : 5"],correct:"A"},
{id:344,origId:38,meta:"CAT/2020.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2020",text:"An alloy is prepared by mixing metals A, B, C in the proportion 3 : 4 : 7 by volume. Weights of the same volume of metals A, B, C are in the ratio 5 : 2 : 6. In 130 kg of the alloy, the weight, in kg, of the metal C is",options:["A : 84","B : 48","C : 96","D : 70"],correct:"A"},
{id:345,origId:39,meta:"CAT/2020.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2020",text:"A solution, of volume 40 litres, has dye and water in the proportion 2 : 3. Water is added to the solution to change this proportion to 2 : 5. If one-fourths of this diluted solution is taken out, how many litres of dye must be added to the remaining solution to bring the proportion back to 2 : 3?",options:null,correct:"8"},
{id:346,origId:40,meta:"CAT/2020.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2020",text:"In a group of 10 students, the mean of the lowest 9 scores is 42 while the mean of the highest 9 scores is 47. For the entire group of 10 students, the maximum possible mean exceeds the minimum possible mean by",options:["A : 5","B : 3","C : 4","D : 6"],correct:"C"},
{id:347,origId:41,meta:"CAT/2020.2(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2020",text:"A sum of money is split among Amal, Sunil and Mita so that the ratio of the shares of Amal and Sunil is 3:2, while the ratio of the shares of Sunil and Mita is 4:5. If the difference between the largest and the smallest of these three shares is Rs 400, then Sunil’s share, in rupees, is",options:null,correct:"800"},
{id:348,origId:42,meta:"CAT/2020.3(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2020",text:"Dick is thrice as old as Tom and Harry is twice as old as Dick. If Dick's age is 1 year less than the average age of all three, then Harry's age, in years, is",options:null,correct:"18"},
{id:349,origId:43,meta:"CAT/2020.3(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2020",text:"A batsman played n + 2 innings and got out on all occasions. His average score in these n + 2 innings was 29 runs and he scored 38 and 15 runs in the last two innings. The batsman scored less than 38 runs in each of the first n innings. In these n innings, his average score was 30 runs and lowest score was x runs. The smallest possible value of x is",options:["A : 1","B : 3","C : 2","D : 4"],correct:"C"},
{id:350,origId:44,meta:"CAT/2019.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2019",text:"In a race of three horses, the first beat the second by 11 metres and the third by 90 metres. If the second beat the third by 80 metres, what was the length, in metres, of the racecourse?",options:null,correct:"880"},
{id:351,origId:45,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2019",text:"Amala, Bina, and Gouri invest money in the ratio 3 : 4 : 5 in fixed deposits having respective annual interest rates in the ratio 6 : 5 : 4. What is their total interest income (in Rs) after a year, if Bina's interest income exceeds Amala's by Rs 250?",options:["A : 7000","B : 6000","C : 6350","D : 7250"],correct:"D"},
{id:352,origId:46,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2019",text:"A chemist mixes two liquids 1 and 2. One litre of liquid 1 weighs 1 kg and one litre of liquid 2 weighs 800 gm. If half litre of the mixture weighs 480 gm, then the percentage of liquid 1 in the mixture, in terms of volume, is",options:["A : 70","B : 85","C : 80","D : 75"],correct:"C"},
{id:353,origId:47,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2019",text:"Ramesh and Gautam are among 22 students who write an examination. Ramesh scores 82.5. The average score of the 21 students other than Gautam is 62. The average score of all the 22 students is one more than the average score of the 21 students other than Ramesh. The score of Gautam is",options:["A : 51","B : 52","C : 53","D : 54"],correct:"A"},
{id:354,origId:48,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2019",text:"The average of 30 integers is 5. Among these 30 integers, there are exactly 20 which do not exceed 5. What is the highest possible value of the average of these 20 integers ?",options:["A : 4","B : 5","C : 4.5","D : 3.5"],correct:"C"},
{id:355,origId:49,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2019",text:"In an examination, Rama's score was one-twelfth of the sum of the scores of Mohan and Anjali. After a review, the score of each of them increased by 6. The revised scores of Anjali, Mohan, and Rama were in the ratio 11:10:3. Then Anjali's score exceeded Rama's score by",options:["A : 26","B : 32","C : 24","D : 35"],correct:"B"},
{id:356,origId:50,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2019",text:"The salaries of Ramesh, Ganesh and Rajesh were in the ratio 6:5:7 in 2010, and in the ratio 3:4:3 in 2015. If Ramesh's salary increased by 25% during 2010-2015, then the percentage increase in Rajesh's salary during this period is closest to",options:["A : 7","B : 8","C : 9","D : 10"],correct:"A"},
{id:357,origId:51,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"A trader sells 10 litres of a mixture of paints A and B, where the amount of B in the mixture does not exceed that of A. The cost of paint A per litre is Rs. 8 more than that of paint B. If the trader sells the entire mixture for Rs. 264 and makes a profit of 10%, then the highest possible cost of paint B, in Rs. per litre, is",options:["A : 20","B : 16","C : 22","D : 26"],correct:"A"},
{id:358,origId:52,meta:"CAT/2018.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2018",text:"A CAT aspirant appears for a certain number of tests. His average score increases by 1 if the first 10 tests are not considered, and decreases by 1 if the last 10 tests are not considered. If his average scores for the first 10 and the last 10 tests are 20 and 30, respectively, then the total number of tests taken by him is",options:null,correct:"60"},
{id:359,origId:53,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"Two types of tea, A and B, are mixed and then sold at Rs. 40 per kg. The profit is 10% if A and B are mixed in the ratio 3 : 2, and 5% if this ratio is 2 : 3. The cost prices, per kg, of A and B are in the ratio",options:["A : 21:25","B : 19:24","C : 18:25","D : 17:25"],correct:"B"},
{id:360,origId:54,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"A wholesaler bought walnuts and peanuts, the price of walnut per kg being thrice that of peanut per kg. He then sold 8 kg of peanuts at a profit of 10% and 16 kg of walnuts at a profit of 20% to a shopkeeper. However, the shopkeeper lost 5 kg of walnuts and 3 kg of peanuts in transit. He then mixed the remaining nuts and sold the mixture at Rs. 166 per kg, thus making an overall profit of 25%. At what price, in Rs. per kg, did the wholesaler buy the walnuts?",options:["A : 84","B : 86","C : 96","D : 98"],correct:"C"},
{id:361,origId:55,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"Raju and Lalitha originally had marbles in the ratio 4 : 9. Then Lalitha gave some of her marbles to Raju. As a result, the ratio of the number of marbles with Raju to that with Lalitha became 5 : 6. What fraction of her original number of marbles was given by Lalitha to Raju?",options:["A : 1/4","B : 1/5","C : 6/19","D : 7/33"],correct:"D"},
{id:362,origId:56,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"In an apartment complex, the number of people aged 51 years and above is 30 and there are at most 39 people whose ages are below 51 years. The average age of all the people in the apartment complex is 38 years. What is the largest possible average age, in years, of the people whose ages are below 51 years?",options:["A : 25","B : 26","C : 27","D : 28"],correct:"D"},
{id:363,origId:57,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"There are two drums, each containing a mixture of paints A and B. In drum 1, A and B are in the ratio 18 : 7. The mixtures from drums 1 and 2 are mixed in the ratio 3 : 4 and in this final mixture, A and B are in the ratio 13 : 7. In drum 2, then A and B were in the ratio",options:["A : 251:163","B : 239:161","C : 220:149","D : 229:141"],correct:"B"},
{id:364,origId:58,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"A 20% ethanol solution is mixed with another ethanol solution, say, S of unknown concentration in the proportion 1:3 by volume. This mixture is then mixed with an equal volume of 20% ethanol solution. If the resultant mixture is a 31.25% ethanol solution, then the unknown concentration of S is",options:["A : 50%","B : 55%","C : 48%","D : 52%"],correct:"A"},
{id:365,origId:59,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"The scores of Amal and Bimal in an examination are in the ratio 11 : 14. After an appeal, their scores increase by the same amount and their new scores are in the ratio 47 : 56. The ratio of Bimal’s new score to that of his original score is",options:["A : 3:4","B : 4:3","C : 5:4","D : 8:5"],correct:"B"},
{id:366,origId:60,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"The strength of a salt solution is p% if 100 ml of the solution contains p grams of salt. If three salt solutions A, B, C are mixed in the proportion 1 : 2 : 3, then the resulting solution has strength 20%. If instead the proportion is 3 : 2 : 1, then the resulting solution has strength 30%. A fourth solution, D, is produced by mixing B and C in the ratio 2 : 7. The ratio of the strength of D to that of A is",options:["A : 3:10","B : 1:3","C : 2:5","D : 1:4"],correct:"B"},
{id:367,origId:61,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2018",text:"<img src='images/images_question_images_2626_question_1111RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 0","B : 1/2","C : -4","D : 10"],correct:"B"},
{id:368,origId:62,meta:"CAT/2017.1(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2017",text:"An elevator has a weight limit of 630 kg. It is carrying a group of people of whom the heaviest weighs 57 kg and the lightest weighs 53 kg. What is the maximum possible number of people in the group?",options:null,correct:"11"},
{id:369,origId:63,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2017",text:"Suppose, C1, C2, C3, C4, and C5 are five companies. The profits made by C1, C2, and C3 are in the ratio 9 : 10 : 8 while the profits made by C2, C4, and C5 are in the ratio 18 : 19 : 20. If C5 has made a profit of Rs 19 crore more than C1, then the total profit (in Rs) made by all five companies is:",options:["A : 438 crore","B : 435 crore","C : 345 crore","D : 348 crore"],correct:"A"},
{id:370,origId:64,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2017",text:"A stall sells popcorn and chips in packets of three sizes: large, super, and jumbo. The numbers of large, super, and jumbo packets in its stock are in the ratio 7 : 17 : 16 for popcorn and 6 : 15 : 14 for chips. If the total number of popcorn packets in its stock is the same as that of chips packets, then the numbers of jumbo popcorn packets and jumbo chips packets are in the ratio:",options:["A : 1:1","B : 8:7","C : 4:3","D : 6:5"],correct:"A"},
{id:371,origId:65,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2017",text:"A class consists of 20 boys and 30 girls. In the mid-semester examination, the average score of the girls was 5 higher than that of the boys. In the final exam, however, the average score of the girls dropped by 3 while the average score of the entire class increased by 2. The increase in the average score of the boys is:",options:["A : 9.5","B : 10","C : 4.5","D : 6"],correct:"A"},
{id:372,origId:66,meta:"CAT/2017.2(Quantitative Ability)",type:"TITA",topic:"Averages, Ratio & Proportion",year:"2017",text:"In a 10 km race. A, B, and C, each running at uniform speed, get the gold, silver, and bronze medals, respectively. If A beats B by 1 km and B beats C by 1 km, then by how many metres does A beat C?",options:null,correct:"1900"},
{id:373,origId:67,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2017",text:"Bottle 1 contains a mixture of milk and water in 7: 2 ratio and Bottle 2 contains a mixture of milk and water in 9: 4 ratio. In what ratio of volumes should the liquids in Bottle 1 and Bottle 2 be combined to obtain a mixture of milk and water in 3: 1 ratio?",options:["A : 27:14","B : 27:13","C : 27:16","D : 27:18"],correct:"B"},
{id:374,origId:68,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2017",text:"The average height of 22 toddlers increases by 2 inches when two of them leave this group. If the average height of these two toddlers is one-third the average height of the original 22, then the average height, in inches, of the remaining 20 toddlers is",options:["A : 30","B : 28","C : 32","D : 26"],correct:"C"},
{id:375,origId:69,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2017",text:"If a, b, c are three positive integers such that a and b are in the ratio 3: 4 while b and c are in the ratio 2 : 1, then which one of the following is a possible value of (a + b + c)?",options:["A : 201","B : 205","C : 207","D : 210"],correct:"C"},
{id:376,origId:70,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2017",text:"Consider three mixtures - the first having water and liquid A in the ratio 1 : 2, the second having water and liquid B in the ratio 1 : 3, and the third having water and liquid C in the ratio 1 : 4. These three mixtures of A, B, and C, respectively, are further mixed in the proportion 4 : 3 : 2. Then the resulting mixture has",options:["A : The same amount of water and liquid B","B : The same amount of liquids B and C","C : More water than liquid B","D : More water than liquid A"],correct:"C"},
{id:377,origId:71,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2007",text:"Ten years ago, the ages of the members of a joint family of eight people added up to 231 years. Three years later, one member died at the age of 60 years and a child was born during the same year. After another three years, one more member died, again at 60, and a child was born during the same year. The current average age of this eight-member joint family is nearest to",options:["A : 23 Years","B : 22 Years","C : 21 Years","D : 25 Years","E : 24 Years"],correct:"E"},
{id:378,origId:72,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2007",text:"Suppose you have a currency, named Miso, in three denominations: 1 Miso, 10 Misos and 50 Misos. In how many ways can you pay a bill of 107 Misos?",options:["A : 17","B : 16","C : 18","D : 15","E : 19"],correct:"C"},
{id:379,origId:73,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2007",text:"The average weight of a class of 100 students is 45 kg. The class consists of two sections, I and II, each with 50 students. The average weight, WI , of Section I is smaller than the average weight WII , of the Section II. If the heaviest student say Deepak, of section II is moved to Section I, and the lightest student, say Poonam, of Section I is moved to Section II, then the average weights of the two sections are switched, i.e., the average weight of Section I becomes WII and that of Section II becomes WI . What is the weight of Poonam? A: WII I – W 1.0 = 1.0. B: Moving Deepak from Section II to I (without any move I to II) makes the average weights of the two sections equal.",options:["A : Mark (1) if the questions can be answered using A alone but not using B alone.","B : Mark (2) if the question can be answered using B alone but not using A alone.","C : Mark (3) if the question can be answered using A and B together, but not using either A or B alone.","D : Mark (4) if the question cannot be answered even using A and B together."],correct:"C"},
{id:380,origId:74,meta:"CAT/2006(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2006",text:"The length, breadth and height of a room are in the ratio 3 : 2 : 1. If the breadth and height are halved while the length is doubled, then the total area of the four walls of the room will",options:["A : remain the same","B : decrease by 13.64%","C : decrease by 15%","D : decrease by 18.75%","E : decrease by 30%"],correct:"E"},
{id:381,origId:75,meta:"CAT/2006(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2006",text:"The number of employees in Obelix Menhir Co. is a prime number and is less than 300. The ratio of the number of employees who are graduates and above, to that of employees who are not, can possibly be:",options:["A : 101 : 88","B : 87 : 100","C : 110 : 111","D : 85 : 98","E : 97 : 84"],correct:"E"},
{id:382,origId:76,meta:"CAT/2006(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2006",text:"What is the weight of Praja's luggage?",options:["A : 20 Kg","B : 25 Kg","C : 30 Kg","D : 35 Kg","E : 40 Kg"],correct:"D"},
{id:383,origId:77,meta:"CAT/2006(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2006",text:"What is the free luggage allowance?",options:["A : 10 Kg","B : 15 Kg","C : 20 Kg","D : 25 Kg","E : 30 Kg"],correct:"B"},
{id:384,origId:78,meta:"CAT/2004(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2004",text:"A sprinter starts running on a circular path of radius r metres. Her average speed (in meters/minute) is πr during the first 30 seconds, πr/2  during next one minute, πr/4 during next 2 minutes, πr/8 during next 4 minutes, and so on. What is the ratio of the time taken for the nth round to that for the previous round?",options:["A : 4","B : 8","C : 16","D : 32"],correct:"C"},
{id:385,origId:79,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2003",text:"In a coastal village, every year floods destroy exactly half of the huts. After the flood water recedes, twice the number of huts destroyed are rebuilt. The floods occurred consecutively in the last three years namely 2001, 2002 and 2003. If floods are again expected in 2004, the number of huts expected to be destroyed is",options:["A : Less than the number of huts existing at the beginning of 2001","B : Less than the total number of huts destroyed by floods in 2001 and 2003","C : Less than the total number of huts destroyed by floods in 2002 and 2003","D : More than the total number of huts built in 2001 and 2002"],correct:"C"},
{id:386,origId:80,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2003",text:"How much does R owe to S in Thai Baht?",options:["A : 428","B : 416","C : 334","D : 324"],correct:"D"},
{id:387,origId:81,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2003",text:"How much does M owe to S in US Dollars?",options:["A : 3","B : 4","C : 5","D : 6"],correct:"C"},
{id:388,origId:82,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2003",text:"A milkman mixes 20 litres of water with 80 litres milk. After selling one-fourth of this mixture, he adds water to replenish the quality that he has sold. What is the current proportion of water to milk?",options:["A : 2 : 3","B : 1 : 2","C : 1 : 3","D : 3 : 4"],correct:"A"},
{id:389,origId:83,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2002",text:"Mayank, Mirza, Little and Jaspal bought a motorbike for $60.00. Mayank paid one half of the sum of the amounts paid by the other boys, Mirza paid one third of the sum of the amounts paid by the other boys; and Little paid one fourth of the sum of the amounts paid by the other boys. How much did Jaspal have to pay?",options:["A : 15","B : 13","C : 17","D : None of these"],correct:"B"},
{id:390,origId:84,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2002",text:"Using only 2, 5, 10, 25 and 50 paise coins, what will be the minimum number of coins required to pay exactly 78 paise, 69 paise, and Rs 1.01 to three different persons?",options:["A : 19","B : 20","C : 17","D : 18"],correct:"A"},
