{id:556,origId:39,meta:"CAT/2020.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"Leaving home at the same time, Amal reaches office at 10:15 am if he travels at 8kmph, and at 9:40 am if he travels at 15kmph. Leaving home at 9:10 am, at what speed, in kmph, must he travel so as to reach office exactly at 10:00 am?",options:["A : 12","B : 11","C : 13","D : 14"],correct:"A"},
{id:557,origId:40,meta:"CAT/2020.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"In a car race, car A beats car B by 45 km, car B beats car C by 50 km, and car A beats car C by 90 km. The distance (in km) over which the race has been conducted is",options:["A : 550","B : 475","C : 500","D : 450"],correct:"D"},
{id:558,origId:41,meta:"CAT/2020.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"The distance from B to C is thrice that from A to B. Two trains travel from A to C via B. The speed of train 2 is double that of train 1 while traveling from A to B and their speeds are interchanged while traveling from B to C. The ratio of the time taken by train 1 to that taken by train 2 in travelling from A to C is",options:["A : 7:5","B : 4:1","C : 1:4","D : 5:7"],correct:"D"},
{id:559,origId:42,meta:"CAT/2020.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"Two circular tracks T1 and T2 of radii 100 m and 20 m, respectively touch at a point A. Starting from A at the same time, Ram and Rahim are walking on track T1 and track T2 at speeds 15 km/hr and 5 km/hr respectively. The number of full rounds that Ram will make before he meets Rahim again for the first time is",options:["A : 5","B : 3","C : 4","D : 2"],correct:"B"},
{id:560,origId:43,meta:"CAT/2020.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"A and B are two points on a straight line. Ram runs from A to B while Rahim runs from B to A. After crossing each other, Ram and Rahim reach their destinations in one minutes and four minutes, respectively. If they start at the same time, then the ratio of Ram's speed to Rahim's speed is",options:["A : 2","B : 2.5","C : 3","D : 0.5"],correct:"A"},
{id:561,origId:44,meta:"CAT/2020.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2020",text:"John takes twice as much time as Jack to finish a job. Jack and Jim together take one-thirds of the time to finish the job than John takes working alone. Moreover, in order to finish the job, John takes three days more than that taken by three of them working together. In how many days will Jim finish the job working alone?",options:null,correct:"4"},
{id:562,origId:45,meta:"CAT/2020.3(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2020",text:"A contractor agreed to construct a 6 km road in 200 days. He employed 140 persons for the work. After 60 days, he realized that only 1.5 km road has been completed. How many additional people would he need to employ in order to finish the work exactly on time?",options:null,correct:"40"},
{id:563,origId:46,meta:"CAT/2020.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"Anil, Sunil, and Ravi run along a circular path of length 3 km, starting from the same point at the same time, and going in the clockwise direction. If they run at speeds of 15 km/hr, 10 km/hr, and 8 km/hr, respectively, how much distance in km will Ravi have run when Anil and Sunil meet again for the first time at the starting point?",options:["A : 4.6","B : 4.2","C : 4.8","D : 5.2"],correct:"C"},
{id:564,origId:47,meta:"CAT/2020.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"A and B are two railway stations 90 km apart. A train leaves A at 9:00 am, heading towards B at a speed of 40 km/hr. Another train leaves B at 10:30 am, heading towards A at a speed of 20 km/hr. The trains meet each other at",options:["A : 11:20 am","B : 11:00 am","C : 10:45 am","D : 11:45 am"],correct:"B"},
{id:565,origId:48,meta:"CAT/2020.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"Vimla starts for office every day at 9 am and reaches exactly on time if she drives at her usual speed of 40 km/hr. She is late by 6 minutes if she drives at 35 km/hr. One day, she covers two-thirds of her distance to office in one-thirds of her usual time to reach office, and then stops for 8 minutes. The speed, in km/hr, at which she should drive the remaining distance to reach office exactly on time is",options:["A : 27","B : 28","C : 29","D : 24"],correct:"B"},
{id:566,origId:49,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2019",text:"Two cars travel the same distance starting at 10:00 am and 11:00 am, respectively, on the same day. They reach their common destination at the same point of time. If the first car travelled for at least 6 hours, then the highest possible value of the percentage by which the speed of the second car could exceed that of the first car is",options:["A : 20","B : 10","C : 35","D : 25"],correct:"A"},
{id:567,origId:50,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2019",text:"At their usual efficiency levels, A and B together finish a task in 12 days. If A had worked half as efficiently as she usually does, and B had worked thrice as efficiently as he usually does, the task would have been completed in 9 days. How many days would A take to finish the task if she works alone at her usual efficiency?",options:["A : 18","B : 12","C : 24","D : 36"],correct:"A"},
{id:568,origId:51,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2019",text:"One can use three different transports which move at 10, 20, and 30 kmph, respectively. To reach from A to B, Amal took each mode of transport 1/3 of his total journey time, while Bimal took each mode of transport 1/3 of the total distance. The percentage by which Bimal's travel time exceeds Amal's travel time is nearest to",options:["A : 22","B : 19","C : 21","D : 20"],correct:"A"},
{id:569,origId:52,meta:"CAT/2019.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2019",text:"Three men and eight machines can finish a job in half the time taken by three machines and eight men to finish the same job. If two machines can finish the job in 13 days, then how many men can finish the job in 13 days?",options:null,correct:"13"},
{id:570,origId:53,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2019",text:"The wheels of bicycles A and B have radii 30 cm and 40 cm, respectively. While traveling a certain distance, each wheel of A required 5000 more revolutions than each wheel of B. If bicycle B traveled this distance in 45 minutes, then its speed, in km per hour, was",options:["A : 18π","B : 16π","C : 12π","D : 14π"],correct:"B"},
{id:571,origId:54,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2019",text:"A cyclist leaves A at 10 am and reaches B at 11 am. Starting from 10:01 am, every minute a motorcycle leaves A and moves towards B. Forty-five such motorcycles reach B by 11 am. All motorcycles have the same speed. If the cyclist had doubled his speed, how many motorcycles would have reached B by the time the cyclist reached B?",options:["A : 22","B : 20","C : 15","D : 23"],correct:"C"},
{id:572,origId:55,meta:"CAT/2019.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2019",text:"John jogs on track A at 6 kmph and Mary jogs on track B at 7.5 kmph. The total length of tracks A and B is 325 metres. While John makes 9 rounds of track A, Mary makes 5 rounds of track B. In how many seconds will Mary make one round of track A?",options:null,correct:"48"},
{id:573,origId:56,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2019",text:"Anil alone can do a job in 20 days while Sunil alone can do it in 40 days. Anil starts the job, and after 3 days, Sunil joins him. Again, after a few more days, Bimal joins them and they together finish the job. If Bimal has done 10% of the job, then in how many days was the job done?",options:["A : 13","B : 12","C : 15","D : 14"],correct:"A"},
{id:574,origId:57,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2019",text:"Two ants A and B start from a point P on a circle at the same time, with A moving clock-wise and B moving anti-clockwise. They meet for the first time at 10:00 am when A has covered 60% of the track. If A returns to P at 10:12 am, then B returns to P at",options:["A : 10:27 am","B : 10:25 am","C : 10:45 am","D : 10:18 am"],correct:"A"},
{id:575,origId:58,meta:"CAT/2019.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2019",text:"John gets Rs 57 per hour of regular work and Rs 114 per hour of overtime work. He works altogether 172 hours and his income from overtime hours is 15% of his income from regular hours. Then, for how many hours did he work overtime?",options:null,correct:"12"},
{id:576,origId:59,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2018",text:"The distance from A to B is 60 km. Partha and Narayan start from A at the same time and move towards B. Partha takes four hours more than Narayan to reach B. Moreover, Partha reaches the mid-point of A and B two hours before Narayan reaches B. The speed of Partha, in km per hour, is",options:["A : 6","B : 3","C : 4","D : 5"],correct:"D"},
{id:577,origId:60,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2018",text:"When they work alone, B needs 25% more time to ﬁnish a job than A does. They two ﬁnish the job in 13 days in the following manner: A works alone till half the job is done, then A and B work together for four days, and ﬁnally B works alone to complete the remaining 5% of the job. In how many days can B alone ﬁnish the entire job?",options:["A : 16","B : 20","C : 22","D : 18"],correct:"C"},
{id:578,origId:61,meta:"CAT/2018.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2018",text:"Point P lies between points A and B such that the length of BP is thrice that of AP. Car 1 starts from A and moves towards B. Simultaneously, car 2 starts from B and moves towards A. Car 2 reaches P one hour after car 1 reaches P. If the speed of car 2 is half that of car 1, then the time, in minutes, taken by car 1 in reaching P from A is",options:null,correct:"12"},
{id:579,origId:62,meta:"CAT/2018.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2018",text:"Train T leaves station X for station Y at 3 pm. Train S, traveling at three quarters of the speed of T, leaves Y for X at 4 pm. The two trains pass each other at a station Z, where the distance between X and Z is three-ﬁfths of that between X and Y. How many hours does train T take for its journey from X to Y?",options:null,correct:"15"},
{id:580,origId:63,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2018",text:"Humans and robots can both perform a job but at diﬀerent eﬃciencies. Fifteen humans and ﬁve robots working together take thirty days to ﬁnish the job, whereas ﬁve humans and ﬁfteen robots working together take sixty days to ﬁnish it. How many days will ﬁfteen humans working together (without any robot) take to ﬁnish it?",options:["A : 40","B : 32","C : 36","D : 45"],correct:"B"},
{id:581,origId:64,meta:"CAT/2018.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2018",text:"A tank is fitted with pipes, some filling it and the rest draining it. All filling pipes fill at the same rate, and all draining pipes drain at the same rate. The empty tank gets completely filled in 6 hours when 6 filling and 5 draining pipes are on, but this time becomes 60 hours when 5 filling and 6 draining pipes are on. In how many hours will the empty tank get completely filled when one draining and two filling pipes are on?",options:null,correct:"10"},
{id:582,origId:65,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2018",text:"Points A, P, Q and B lie on the same line such that P, Q and B are, respectively, 100 km, 200 km and 300 km away from A. Cars 1 and 2 leave A at the same time and move towards B. Simultaneously, car 3 leaves B and moves towards A. Car 3 meets Car 1 at Q, and Car 2 at P. If each car is moving in uniform speed then the ratio of the speed of Car 2 to that of Car 1 is",options:["A : 1:4","B : 2:9","C : 1:2","D : 2:7"],correct:"A"},
{id:583,origId:66,meta:"CAT/2018.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2018",text:"On a long stretch of east-west road, A and B are two points such that B is 350 km west of A. One car starts from A and another from B at the same time. If they move towards each other, then they meet after 1 hour. If they both move towards east, then they meet in 7 hrs. The difference between their speeds, in km per hour, is",options:null,correct:"50"},
{id:584,origId:67,meta:"CAT/2018.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2018",text:"Points A and B are 150 km apart. Cars 1 and 2 travel from A to B, but car 2 starts from A when car 1 is already 20 km away from A. Each car travels at a speed of 100 kmph for the first 50 km, at 50 kmph for the next 50 km, and at 25 kmph for the last 50 km. The distance, in km, between car 2 and B when car 1 reaches B is",options:null,correct:"5"},
{id:585,origId:68,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2018",text:"A tank is emptied everyday at a fixed time point. Immediately thereafter, either pump A or pump B or both start working until the tank is full. On Monday, A alone completed filling the tank at 8 pm. On Tuesday, B alone completed filling the tank at 6 pm. On Wednesday, A alone worked till 5 pm, and then B worked alone from 5 pm to 7 pm, to fill the tank. At what time was the tank filled on Thursday if both pumps were used simultaneously all along?",options:["A : 4:12 pm","B : 4:24 pm","C : 4:48 pm","D : 4:36 pm"],correct:"B"},
{id:586,origId:69,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2018",text:"Ramesh and Ganesh can together complete a work in 16 days. After seven days of working together, Ramesh got sick and his efficiency fell by 30%. As a result, they completed the work in 17 days instead of 16 days. If Ganesh had worked alone after Ramesh got sick, in how many days would he have completed the remaining work?",options:["A : 12","B : 14.5","C : 13.5","D : 11"],correct:"C"},
{id:587,origId:70,meta:"CAT/2018.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2018",text:"A water tank has inlets of two types A and B. All inlets of type A when open, bring in water at the same rate. All inlets of type B, when open, bring in water at the same rate. The empty tank is completely filled in 30 minutes if 10 inlets of type A and 45 inlets of type B are open, and in 1 hour if 8 inlets of type A and 18 inlets of type B are open. In how many minutes will the empty tank get completely filled if 7 inlets of type A and 27 inlets of type B are open?",options:null,correct:"48"},
{id:588,origId:71,meta:"CAT/2017.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2017",text:"A person can complete a job in 120 days. He works alone on Day 1. On Day 2, he is joined by another person who also can complete the job in exactly 120 days. On Day 3, they are joined by another person of equal efficiency. Like this, everyday a new person with the same efficiency joins the work. How many days are required to complete the job?",options:null,correct:"15"},
{id:589,origId:72,meta:"CAT/2017.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2017",text:"A man leaves his home and walks at a speed of 12 km per hour, reaching the railway station 10 minutes after the train had departed. If instead he had walked at a speed of 15 km per hour, he would have reached the station 10 minutes before the train's departure. The distance (in km) from his home to the railway station is:",options:null,correct:"20"},
{id:590,origId:73,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2017",text:"A man travels by a motor boat down a river to his office and back. With the speed of the river unchanged, if he doubles the speed of his motor boat, then his total travel time gets reduced by 75%. The ratio of the original speed of the motor boat to the speed of the river is:",options:["A : √6 : √2","B : √7 : 2","C : 2√5 : 3","D : 3:2"],correct:"B"},
{id:591,origId:74,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2017",text:"Arun drove from home to his hostel at 60 miles per hour. While returning home he drove half way along the same route at a speed of 25 miles per hour and then took a bypass road which increased his driving distance by 5 miles, but allowed him to drive at 50 miles per hour along this bypass road. If his return journey took 30 minutes more than his onward journey, then the total distance travelled by him is",options:["A : 55 miles","B : 60 miles","C : 65 miles","D : 70 miles"],correct:"C"},
{id:592,origId:75,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2017",text:"A tank has an inlet pipe and an outlet pipe. If the outlet pipe is closed then the inlet pipe fills the empty tank in 8 hours. If the outlet pipe is open then the inlet pipe fills the empty tank in 10 hours. If only the outlet pipe is open then in how many hours the full tank becomes half-full?",options:["A : 20","B : 30","C : 40","D : 50"],correct:"A"},
{id:593,origId:76,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2017",text:"A motorbike leaves point A at 1 pm and moves towards point B at a uniform speed. A car leaves point B at 2 pm and moves towards point A at a uniform speed which is double that of the motorbike. They meet at 3:40 pm at a point which is 168 km away from A. What is the distance, in km, between A and B?",options:["A : 364","B : 378","C : 380","D : 388"],correct:"B"},
{id:594,origId:77,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2017",text:"Amal can complete a job in 10 days and Bimal can complete it in 8 days. Amal, Bimal and Kamal together complete the job in 4 days and are paid a total amount of Rs 1000 as remuneration. If this amount is shared by them in proportion to their work, then Kamal's share, in rupees, is",options:["A : 100","B : 200","C : 300","D : 400"],correct:"A"},
{id:595,origId:78,meta:"CAT/2008(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2008",text:"Rahim plans to drive from city A to station C, at the speed of 70 km per hour, to catch a train arriving there from B. He must reach C at least 15 minutes before the arrival of the train. The train leaves B, located 500 km south of A, at 8:00 am and travels at a speed of 50 km per hour. It is known that C is located between west and northwest of B, with BC at 60° to AB. Also, C is located between south and southwest of A with AC at 30° to AB. The latest time by which Rahim must leave A and still catch the train is closest to",options:["A : 6 : 15 am","B : 6 : 30 am","C : 6 :45 am","D : 7 : 00 am","E : 7 : 15 am"],correct:"B"},
{id:596,origId:79,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2007",text:"What is the time difference between A and B?",options:["A : 1 hour and 30 minutes","B : 2 hours","C : 2 hours and 30 minutes","D : 1 hour","E : Cannot be determined"],correct:"D"},
{id:597,origId:80,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2007",text:"What is the plane’s cruising speed in km per hour?",options:["A : 700","B : 550","C : 600","D : 500","E : Cannot be determined."],correct:"B"},
{id:598,origId:81,meta:"CAT/2006(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2006",text:"Arun, Barun and Kiranmala start from the same place and travel in the same direction at speeds of 30, 40 and 60 km per hour respectively. Barun starts two hours after Arun. If Barun and Kiranmala overtake Arun at the same instant, how many hours after Arun did Kiranmala start?",options:["A : 3","B : 3.5","C : 4","D : 4.5","E : 5"],correct:"C"},
{id:599,origId:82,meta:"CAT/2005(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2005",text:"A chemical plant has four tanks (A, B, C and D) each containing 1000 litres of a chemical. The chemical is being pumped from one tank to another as follows : From A to B @ 20 litres/minute From C to A @ 90 litres/minute From A to D @ 10 litres/minute From C to D @ 50 litres/minute From B to C @ 100 litres/minute From D to B @ 110 litres/minute Which tank gets emptied first, and how long does it take (in minutes) to get empty after pumping starts?",options:["A : A, 16.66","B : C, 20","C : D, 20","D : D, 25"],correct:"C"},
{id:600,origId:83,meta:"CAT/2005(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2005",text:"At what time do Ram and Shyam first meet each other?",options:["A : 10 a.m.","B : 10:10 a.m.","C : 10:20 a.m.","D : 10:30 a.m"],correct:"B"},
{id:601,origId:84,meta:"CAT/2005(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2005",text:"At what time does Shyam overtake Ram?",options:["A : 10:20 a.m","B : 10:30 a.m","C : 10:40 a.m.","D : 10:50 a.m."],correct:"B"},
{id:602,origId:85,meta:"CAT/2005(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2005",text:"Karan and Arjun run a 100-metre race, where Karan beats Arjun by 10 metres. To do a favour to Arjun, Karan starts 10 metres behind the starting line in a second 100-metre race. They both run at their earlier speeds. Which of the following is true in connection with the second race?",options:["A : Karan and Arjun reach the following line simultaneously","B : Arjun beats Karan by 1 metre","C : Arjun beats Karan by 11 metre","D : Karan beats Arjun by 1 metre"],correct:"D"},
{id:603,origId:86,meta:"CAT/2004(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2004",text:"If a man cycles at 10 km/hr, then he arrives at a certain place at 1 pm. If he cycles at 15 km/hr, he will arrive at the same place at 11 am. At what speed must he cycle to get there at noon?",options:["A : 11 km/hr","B : 12 km/hr","C : 13 km/hr","D : 14 km/hr"],correct:"B"},
{id:604,origId:87,meta:"CAT/2004(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2004",text:"Two boats, traveling at 5 and 10 kms per hour, head directly towards each other. They begin at a distance 20 kms from each other. How far apart are they (in kms) one minute before they collide?",options:["A : 1/12","B : 1/6","C : 1/4","D : 1/3"],correct:"C"},
{id:605,origId:88,meta:"CAT/2004(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2004",text:"In nuts and bolts factory, one machine produces only nuts at the rate of 100 nuts per minute and needs to be cleaned for 5 minutes after production of every 1000 nuts. Another machine produces only bolts at the rate of 75 bolts per minute and needs to be cleaned for 10 minutes after production of every 1500 bolts. If both the machines start production at the same time, what is the minimum duration required for producing 9000 pairs of nuts and bolts?",options:["A : 130 minutes","B : 135 minutes","C : 170 minutes","D : 180 minutes"],correct:"C"},
{id:606,origId:89,meta:"CAT/2004(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2004",text:"In a 4000 metre race around a circular stadium having a circumference of 1000 metres, the fastest runner and the slowest runner reach the same point at the end of the 5th minute for the first time after the start of the race. All the runners have the same starting point and each runner maintains a uniform speed throughout the race. If the fastest runner runs at twice the speed of the slowest runner, what is the time taken by the fastest runner to finish the race?",options:["A : 20 min","B : 15 min","C : 10 min","D : 5 min"],correct:"C"},
{id:607,origId:90,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"Amit wants to reach E2 from N1 using first the chord N1-W2 and then the inner ring road. What will be his travel time in minutes on the basis of information given in the above question",options:["A : 60","B : 45","C : 90","D : 105"],correct:"D"},
{id:608,origId:91,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"Amit wants to reach N2 from S1. It would take him 90 minutes if he goes on minor arc S1-E1 on OR, and then on the chord road E1-N2. What is the radius of the outer ring road in kms?",options:["A : 60","B : 40","C : 30","D : 20"],correct:"C"},
{id:609,origId:92,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"The ratio of the sum of the lengths of all chord roads to the length of the outer ring road is",options:["A : √5 : 2","B : √5 : 2π","C : √5 : π","D : None of the above."],correct:"C"},
{id:610,origId:93,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"A car is being driven, in a straight line and at a uniform speed, towards the base of a vertical tower. The top of the tower is observed from the car and, in the process, it takes 10 minutes for the angle of elevation to change from 45° to 60°. After how much more time will this car reach the base of the tower?",options:["A : 5(√3 + 1)","B : 6(√3 + √2)","C : 7(√3 - 1)","D : 8(√3 - 2)"],correct:"A"},
{id:611,origId:94,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"Let the radius of each circular park be r, and the distances to be traversed by the sprinters A, B and C be a,b and c, respectively. Which of the following is true?",options:["A : [IMG:images/question_images_3286_answer_12322_RK5CYII=1.png]","B : [IMG:images/question_images_3286_answer_12323_TkSuQmCC1.png]","C : [IMG:images/question_images_3286_answer_12324_rkJgggEQ1.png]","D : [IMG:images/question_images_3286_answer_12325_rkJgggEQ1.png]"],correct:"A"},
{id:612,origId:95,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"Sprinter A traverses distances A1 A2 , A2 A3 and A3 A1 at average speeds of 20, 30 and 15, respectively. B traverses her entire path at a uniform speed of (10 3 + 20). C traverses distances C1 C2 , C2 C3 and C3 C1 at average speeds of 40/3(√3 + 1 ), 40/3(√3 + 1) and 120, respectively. All speeds are in the same unit. Where would B and C be respectively when A finishes her sprint?",options:["A : B1 , C1","B : B3 , C3","C : B1 , C3","D : B1 , somewhere between C3 & C1"],correct:"C"},
{id:613,origId:96,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"Sprinters A, B and C traverse their respective paths at uniform speeds of u, v and w respectively. It is known that u² : v² : w² is equal to Area A : Area B : Area C, where Area A, Area B and Area C are the areas of triangles A1 A2 A3 , B1 B2 B3 and C1 C2 C3 , respectively. Where would A and C be when B reaches point B3 ?",options:["A : A2 , C3","B : A3 , C3","C : A3 , C2","D : Somewhere between A2 & A3 , somewhere between C3 & C1"],correct:"B"},
{id:614,origId:97,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2003",text:"Two straight roads R1 and R2 diverge from a point A at an angle of 120°. Ram starts walking from point A along R1 at a uniform speed of 3 km/hr. Shyam starts walking at the same time from A along R2 at a uniform speed of 2 km/h. They continue walking for 4 hours along their respective roads and reach points B and C on R1 and R2 , respectively. There is a straight line path connecting B and C. Then Ram returns to point A after walking along the line segments BC and CA. Shyam also returns to A after walking along line segments CB and BA. Their speeds remain unchanged. The time interval (in hours) between Ram’s and shyam’s return to the point A is",options:["A : [IMG:images/question_images_3289_answer_12334_RK5CYII=1.png]","B : [IMG:images/question_images_3289_answer_12335_RK5CYII=1.png]","C : [IMG:images/question_images_3289_answer_12336_TkSuQmCC1.png]","D : [IMG:images/question_images_3289_answer_12337_RK5CYII=1.png]"],correct:"B"},
{id:615,origId:98,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"6 technicians take total 10 hours to build a new server from Direct Computer, with each working at the same rate. If six technicians start to build the server at 11:00 am, and one technician per hour is added beginning at 5:00 pm, at what time will the server be complete?",options:["A : 6:40 pm","B : 7:00 pm","C : 7:20 pm","D : 8 pm"],correct:"D"},
{id:616,origId:99,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"3 small pumps and a large pump are filling a tank. Each of the three small pumps works at 2/3rd the rate of the large pump. If all 4 pumps work at the same time, they should fill the tank in what fraction of the time that it would have taken the large pump alone?",options:["A : 4/7","B : 1/3","C : 2/3","D : 3/4"],correct:"B"},
{id:617,origId:100,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"On a straight road XY, 100 metres long, five heavy stones are placed two metres apart beginning at the end X. A worker, starting at X, has to transport all the stones to Y, by carrying only one stone at a time. The minimum distance he has to travel (in metres) is",options:["A : 472","B : 422","C : 744","D : 860"],correct:"D"},
{id:618,origId:101,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"Only a single rail track exists between station A and B on a railway line. One hour after the north bound super fast train N leaves station A for station B, a south bound passenger train S reaches station A from station B. The speed of the super fast train is twice that of a normal express train E, while the speed of a passenger train S is half that of E. On a particular day N leaves for station B from Station A, 20 minutes behind the normal schedule. In order to maintain the schedule both N and S increased their speed. If the super fast train doubles its speed, what should be the ratio (approximately) of the speed of passenger train to that of the super fast train so that passenger train S reaches exactly at the scheduled time at station A on that day",options:["A : 1 : 3","B : 1 : 4","C : 1 : 5","D : 1 : 6"],correct:"D"},
{id:619,origId:102,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"On a 20 km tunnel connecting two cities A and B there are three gutters. The distance between gutter 1 and 2 is half the distance between gutter 2 and 3. The distance from City A to its nearest gutter, gutter 1 is equal to the distance of city B from gutter 3. On a particular day the hospital in city A receives information that an accident has happened at the third gutter. The victim can be saved only if an operation is started within 40 minutes. An ambulance started from city A at 30 km/hr and crossed the first gutter after 5 minutes. If the driver had doubled the speed after that, what is the maximum amount of time the doctor would get to attend the patient at the hospital? Assume 1 minute is elapsed for taking the patient into and out of the ambulance",options:["A : 4 minutes","B : 2.5 minutes","C : 1.5 minutes","D : Patient died before reaching the hospital"],correct:"C"},
{id:620,origId:103,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"A car rental agency has following terms. If a car is rented for 5 hours or less the charge is Rs 60 per hour or Rs 12 per kilometre whichever is more. On the other hand, if the car is rented for more than 5 hours, the charge is Rs 50 per hour or Rs 7.50 per kilometre whichever is more. Akil rented a car from this agency, drove it for 30 kilometers and ended up paying Rs 300. For how many hours did he rented the Car?",options:["A : 4","B : 5","C : 6","D : None of these"],correct:"C"},
{id:621,origId:104,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"A train approaches a tunnel AB. Inside the tunnel is a cat located at a point that is 3/8 of the distance AB measured from the entrance A. When the train whistles the cat runs. If the cat moves to the entrance of the tunnel, A, the train catches the cat exactly at the entrance. If the cat moves to the exit, B, the train catches the cat at exactly the exit. The speed of the train is greater than the speed of the cat by what order?",options:["A : 3 : 1","B : 4 : 1","C : 5 : 1","D : None of these"],correct:"B"},
{id:622,origId:105,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2002",text:"A can complete a piece of work in 4 days. B takes double the times taken by A, C takes double that of B, and D takes double that of C to complete the same task. They are paired in groups of two each. One pair takes two- third the time needed by the second pair to complete the work. Which is the first pair?",options:["A : A, B","B : A, C","C : B, C","D : A, D"],correct:"D"},
{id:623,origId:106,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"If 09/12/2001 happens to be Sunday, then 09/12/1971 would have been",options:["A : Wednesday","B : Tuesday","C : Saturday","D : Thursday"],correct:"D"},
{id:624,origId:107,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"At his usual rowing rate, Rahul can travel 12 miles downstream in a certain river in six hours less than it takes him to travel the same distance upstream. But if he could double his usual rowing rate for this 24 mile round trip, the downstream 12 miles would then take only one hour less than the upstream 12 miles. What is the speed of the current in miles per hour?",options:["A : 7/3","B : 4/3","C : 5/3","D : 8/3"],correct:"D"},
{id:625,origId:108,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"Shyama and Vyom walk up an escalator (moving stairway). The escalator moves at a constant speed. Shyama takes three steps for every two of Vyom’s steps. Shyama gets to the top of the escalator after having taken 25 steps, while Vyom (because his slower pace lets the escalator do a little more of the work) takes only 20 steps to reach the top. If the escalator were turned off, how many steps would they have to take to walk up?",options:["A : 40","B : 50","C : 60","D : 80"],correct:"B"},
{id:626,origId:109,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"There’s a lot of work in preparing a birthday dinner. Even after the turkey is in the oven, there’s still the potatoes and gravy, yams, salad, and cranberries, not to mention setting the table. Three friends, Asit, Arnold, and Afzal, work together to get all of these chores done. The time it takes them to do the work together is six hours less than Asit would have taken working alone, one hour less than Arnold would have taken alone, and half the time Afzal would have taken working alone. How long did it take them to do these chores working together?",options:["A : 20 minutes","B : 30 minutes","C : 40 minutes","D : 50 minutes"],correct:"C"},
{id:627,origId:110,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"A train X departs from station A at 11.00 am for station B, which is 180 km away. Another train Y departs from station B at 11.00 am for station A. Train X travels at an average speed of 70 kms/hr and does not stop any where until it arrives at station B. Train Y travels at an average speed of 50 kms/hr, but has to stop for 15 minutes at station C, which is 60 kms away from station B enroute to station A. Ignoring the lengths the train , what is the distance , to the nearest km, from station A to the point where the trains cross each other?",options:["A : 112","B : 118","C : 120","D : None of these"],correct:"A"},
{id:628,origId:111,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"Three runners A, B and C run a race, with runner A finishing 12 metres ahead of runner B and 18 metres ahead of runner C, while runner B finishes 8 metres ahead of C. Each runner travels the entire distance at constant speed. What was the length of the race?",options:["A : 36 metres","B : 48 metres","C : 60 metres","D : 72 metres"],correct:"B"},
{id:629,origId:112,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"Manasa makes the 200 km trip from Mumbai at a steady speed of 60 km per hour. What is the amount of petrol consumed for the journey?",options:["A : 12.5 litres","B : 13.33 litres","C : 16 litres","D : 19.75 litres"],correct:"B"},
{id:630,origId:113,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"Manasa would like to minimize the fuel consumption for the trip by driving at the appropriate speed. How should she change the speed?",options:["A : Increase the speed","B : Decrease the speed","C : Maintain the speed at 60 km/hour","D : Cannot be determined"],correct:"B"},
{id:631,origId:114,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2001",text:"A and B are two cities 10 km apart. A load of 80 kg has to be transported form A to B. The courier service charges @ 10Rs per hour. The optimal speed that one can go without load is 10 km/hr, the speed reduces to 5 km/hr with a weight of 10 Kg. Further with 20 kg (which is the maximum weight that can be carried), the speed is 2 km/hr. what is the minimum cost?",options:["A : 200","B : 180","C : 160","D : 140"],correct:"C"},
{id:632,origId:115,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2000",text:"Suppose on a certain day, machines A and D have sent the first two messages to the origin at the beginning of the 1st second, C has sent a message at the beginning of the 5th second, B at the beginning of the 6th second and E at the beginning of the 10th second. How much distance has the robot travelled since the beginning of the day, when it notices the message of E? Assume that the speed of movement of the robot is 10 m/s.",options:["A : 140 m","B : 80 m","C : 340 m","D : 360 m"],correct:"A"},
{id:633,origId:116,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2000",text:"Suppose there is a second station with raw material for the robot at the other extreme of the line which is 60 m from the origin, i.e., 10 m from E. After finishing the services in a trip, the robot returns to the nearest station. If both stations are equidistant, it chooses the origin as the station to return to. Assuming that both stations receive the message sent by the machines and that all the other data remains the same, what would be the answer to the above question?",options:["A : 120","B : 140","C : 340","D : 70"],correct:"A"},
{id:634,origId:117,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2000",text:"The vehicle of Mr. Ghosh needs 30% more fuel at the speed of 75 kmph than it needs at the speed of 50 kmph. At a speed of 50 kmph, Mr. Ghosh can go to a distance of 195 kms. At the speed of 75 kmph, he will able to travel a distance of",options:["A : 120 kms","B : 150 kms","C : 160 kms","D : 140 kms"],correct:"B"},
{id:635,origId:118,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"How many litres of fuel is consumed by Aditi",options:["A : 7","B : 9","C : 10","D : 15"],correct:"B"},
{id:636,origId:119,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"Zorin would like to drive Aditi’s car over the same route form A to B. minimize the petrol consumption for the trip. The amount of petrol required by him is",options:["A : 6.67 litres","B : 7 litres","C : 6.33 litres","D : 6.0 litres"],correct:"A"},
{id:637,origId:120,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"Navjeeven exp., which goes form Ahmedabad to Chennai leaves Ahmedabad at 6:30 am and travels at a constant speed of 50 kmph towards Baroda, which is 100 kms away. At 7:00, the How -Ambd exp. leaves for Ahmedabad from Baroda at a constant speed of 40 kmph. At 7:30 Mr. Shah, the control officer, realises that both the trains are on the same track. How much time does Mr. Shah have to avert the accident?",options:["A : 30 min","B : 20 min","C : 25 min","D : 15 min"],correct:"B"},
{id:638,origId:121,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"A railway engine moves with the speed of 42 kmph. The reduction in speed varies as the square root of the number of compartments attached to it. The speed is 24 kmph when 9 compartments are attached. What is the maximum number of compartments that the engine can pull?",options:["A : 47","B : 48","C : 49","D : 42"],correct:"B"},
{id:639,origId:122,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"What is the average speed of Y between A-C",options:["A : 52 kmph","B : 50 kmph","C : 49.5 kmph","D : 48 kmph"],correct:"C"},
{id:640,origId:123,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"What is the distance B-C?",options:["A : 30.55 km","B : 37.5 km","C : 62.5 km","D : Indeterminable"],correct:"A"},
{id:641,origId:124,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"What is the distance A-C",options:["A : 105 km","B : 112.5 km","C : 135.5 km","D : Indeterminable"],correct:"A"},
{id:642,origId:125,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1999",text:"A company has a job to prepare certain no. of cans and there are three machines A, B & C for this job. A can complete the job in 3 days, B can complete the job in 4 days and C can complete the job in 6 days. How many days the company will take to complete job if all the machines are used simultaneously?",options:["A : 4 days","B : 4/3 days","C : 3 days","D : 12 days"],correct:"B"},
{id:643,origId:126,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1998",text:"Distance between A and B is 72 km. Two men started walking from A and B at the same time towards each other. The person who started from A travelled uniformly with average speed 4 kmph. While the other man travelled with varying speeds as follows : In first hour his speed was 2 kmph, in the second hour it was 2.5 kmph, in the third hour it was 3 kmph, and so on. When will they meet each other?",options:["A : 7 hours","B : 10 hours","C : 35 km from A","D : midway between A & B"],correct:"D"},
{id:644,origId:127,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1998",text:"I started climbing up the hill at 6 am and reached the temple at the top at 6 pm Next day I started coming down at 6 am and reached the foothill at 6 pm. I walked on the same road. The road is so short that only one person can walk on it. Although I varied my pace on my way, I never stopped on my way. Then which of the following must be true",options:["A : My average speed downhill was greater than that uphill","B : At noon, I was at the same spot on both the days.","C : There must be a point where I reached at the same time on both the days.","D : There cannot be a spot where I reached at the same time on both the days."],correct:"C"},
{id:645,origId:128,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1998",text:"An express train travelling at 80 kmph overtakes a goods train, twice as long and going at 40 kmph on a parallel track, in 54 seconds. How long will the express train take to cross a station 400 m long?",options:["A : 36 sec","B : 45 sec","C : 27 sec","D : None of these"],correct:"A"},
{id:646,origId:129,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1997",text:"Boston is 4 hours ahead of Frankfurt and two hours behind India. X leaves Frankfurt at 06:00 pm on Friday and reaches Boston the next day. After waiting there for two hours, he leaves exactly at noon and reaches India at 01:00 am. On his return journey, he takes the same route as before, but halts at Boston for one hour less than his previous halt there. He then proceeds to Frankfurt. If his journey, including stoppages, was covered at an average speed of 180 miles per hour, what was the distance between Frankfurt and India?",options:["A : 3600 miles","B : 4500 miles","C : 5580 miles","D : Insufficient data"],correct:"B"},
{id:647,origId:130,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1997",text:"Boston is 4 hours ahead of Frankfurt and two hours behind India. X leaves Frankfurt at 06:00 pm on Friday and reaches Boston the next day. After waiting there for two hours, he leaves exactly at noon and reaches India at 01:00 am. On his return journey, he takes the same route as before, but halts at Boston for one hour less than his previous halt there. He then proceeds to Frankfurt. If X had started his return journey from India at 02:55 am on the same day that he reached there, after how much time would he reach Frankfurt?",options:["A : 24 hrs","B : 25 hrs","C : 26 hrs","D : Insufficient data"],correct:"A"},
{id:648,origId:131,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1997",text:"Boston is 4 hours ahead of Frankfurt and two hours behind India. X leaves Frankfurt at 06:00 pm on Friday and reaches Boston the next day. After waiting there for two hours, he leaves exactly at noon and reaches India at 01:00 am. On his return journey, he takes the same route as before, but halts at Boston for one hour less than his previous halt there. He then proceeds to Frankfurt. What was X’s average speed for the entire journey?",options:["A : 170 mph","B : 180 mph","C : 165 mph","D : Insufficient data"],correct:"B"},
{id:649,origId:132,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1997",text:"At what time did X catch the thief?",options:["A : 3:30 pm.","B : 3:00 pm","C : 3:15 pm","D : None of these"],correct:"C"},
{id:650,origId:133,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1997",text:"If another policeman had started the same chase along with X, but at a speed of 60 kmph, then how far behind was he when X caught the thief?",options:["A : 18.75 km","B : 15 km","C : 21 km","D : 37.5 km"],correct:"B"},
{id:651,origId:134,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1997",text:"Persons X, Y and Z wish to go from place A to place B, which are separated by a distance of 70 km. All the three persons start off together from A, with X and Y going by Luna at a speed of 20 kmph. X drops Y somewhere along the way and returns to pick up Z, who has already started walking towards B at a speed of 5 kmph. Y, after being dropped by X, starts walking towards B at a speed of 5 kmph. In this manner, all three of them reach B at the same time. How much distance is covered by Z on foot?",options:["A : 25 km","B : 10 km","C : 20 km","D : 15 km"],correct:"C"},
{id:652,origId:135,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1996",text:"Persons X, Y and Z wish to go from place A to place B, which are separated by a distance of 70 km. All the three persons start off together from A, with X and Y going by Luna at a speed of 20 kmph. X drops Y somewhere along the way and returns to pick up Z, who has already started walking towards B at a speed of 5 kmph. Y, after being dropped by X, starts walking towards B at a speed of 5 kmph. In this manner, all three of them reach B at the same time. What is the total distance travelled by x?",options:["A : 130 km","B : 140 km","C : 110 km","D : 90 km"],correct:"A"},
{id:653,origId:136,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1996",text:"Persons X, Y and Z wish to go from place A to place B, which are separated by a distance of 70 km. All the three persons start off together from A, with X and Y going by Luna at a speed of 20 kmph. X drops Y somewhere along the way and returns to pick up Z, who has already started walking towards B at a speed of 5 kmph. Y, after being dropped by X, starts walking towards B at a speed of 5 kmph. In this manner, all three of them reach B at the same time. How long does it take them to go from A to B?",options:["A : 6.0 hours","B : 6.5 hours","C : 7.0 hours","D : 14.0 hours"],correct:"B"},
{id:654,origId:137,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1996",text:"A man travels three-fifths of a distance AB at a speed of 3a, and the remaining at a speed of 2b. If he goes from B to A and back at a speed of 5c in the same time, then",options:["A : 1/a +1/b = 1/c","B : a + b = c","C : 1/a +1/b = 2/c","D : None of these"],correct:"C"},
{id:655,origId:138,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1996",text:"A man travels from A to B at a speed of x kmph. He then rests at B for x hours. He then travels from B to C at a speed of 2x kmph and rests at C for 2x hours. He moves further to D at a speed twice as that between B and C. He thus reaches D in 16 hours. If distances A-B, B-C, C-D are all equal to 12 km, the time for which he rested at B could be",options:["A : 3 hours","B : 6 hours","C : 2 hours","D : 4 hours"],correct:"A"},
{id:656,origId:139,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1996",text:"In a watch, the minute hand crosses the hour hand for the third time exactly after every 3 hrs., 18 min., 15 seconds of watch time. What is the time gained or lost by this watch in one day?",options:["A : 14 min. 10 seconds lost","B : 13 min. 50 seconds lost","C : 13min. 20 seconds gained","D : 14 min. 40 seconds gained"],correct:"B"},
{id:657,origId:140,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1996",text:"In a mile race, Akshay can be given a start of 128 metres by Bhairav. If Bhairav can give Chinmay a start of 4 metres in a 100 metres dash, then who out of Akshay and Chinmay will win a race of one and a half mile, and what will be the final lead given by the winner to the loser? (one mile is 1600 metres)",options:["A : Akshay, 1/12 miles","B : Chinmay, 1/32 miles","C : Akshay, 1/ 24 miles","D : Chinmay, 1/16 miles"],correct:"D"},
{id:658,origId:141,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1996",text:"In a race of 200 metres run, A beats S by 20 metres and N by 40 metres. If S and N are running a race of 100 metres with exactly same speed as before then, by how many metres will S beat N ?",options:["A : 11.11 metres","B : 10 metres","C : 12 metres","D : 25 metres"],correct:"A"},
{id:659,origId:142,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1995",text:"A and B are running along a circular course of radius 7 km in opposite directions such that when they meet they reverse their directions and when they meet A will run at the speed of B and vice-versa. Initially, the speed of A is thrice the speed of B. Assume that they start from M0 and they first meet at M1 , then at M2 , next at M3 , and finally at M4 What is the shortest distance between M1 and M2 ?",options:["A : 11km","B : 7√2 km","C : 7 km","D : 14 km"],correct:"B"},
{id:660,origId:143,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1995",text:"A and B are running along a circular course of radius 7 km in opposite directions such that when they meet they reverse their directions and when they meet A will run at the speed of B and vice-versa. Initially, the speed of A is thrice the speed of B. Assume that they start from M0 and they first meet at M1 , then at M2 , next at M3 , and finally at M4 What is the shortest distance between M1 and M3 along the course?",options:["A : 22 km","B : 14√2 km","C : 22√2 km","D : 14 km"],correct:"A"},
{id:661,origId:144,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1995",text:"Two towns A and B are 100 km apart. A school is to be built for 100 students of town B and 30 students of town A. Expenditure on transport is Rs 1.20 per km per student. If the total expenditure on transport by all 130 students is to be as small as possible, then the school should be built at",options:["A : 33 km from Town A","B : 33 km from Town B","C : Town A","D : Town B"],correct:"D"},
{id:662,origId:145,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"One man can do as much work in one day as a woman can do in 2 days. A child does one third the work in a day as a woman. If an estate-owner hires 39 pairs of hands, men, women and children in the ratio 6 : 5 : 2 and pays them in all Rs 1113 at the end of the days work. What must be the daily wage of a child, if the wages are proportional to the amount of work done?",options:["A : Rs 14","B : Rs 5","C : Rs 20","D : Rs 7"],correct:"D"},
{id:663,origId:146,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"A water tank has three taps A, B and C. A fills four buckets in 24 minutes, B fills 8 buckets in 1 hour and C fills 2 buckets in 20 minutes. If all the taps are opened together a full tank is emptied in 2 hours. If a bucket can hold 5 litres of water, what is the capacity of the tank?",options:["A : 120 litres","B : 240 litres","C : 180 litres","D : 60 litres"],correct:"B"},
{id:664,origId:147,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"Shyam went from Delhi to Simla via Chandigarh by car. The distance from Delhi to Chandigarh is 3/4 times the distance from Chandigarh to Simla. The average speed from Delhi to Chandigarh was half as much again as that from Chandigarh to Simla. If the average speed for the entire journey was 49 kmph. What was the average speed from Chandigarh to Simla?",options:["A : 39.2 kmph","B : 63 kmph","C : 42 kmph","D : None of these"],correct:"C"},
{id:665,origId:148,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"It takes the pendulum of a clock 7 seconds to strike 4 o’clock. How much time will it take to strike 11 o’clock?",options:["A : 18 seconds","B : 20 seconds","C : 19.25 seconds","D : 23.33 seconds"],correct:"D"},
{id:666,origId:149,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"Four friends start from four towns, which are at the four corners of an imaginary rectangle. They meet at a point which falls inside the rectangle, after travelling distances of 40, 50, and 60 metres. The maximum distance that the fourth could have travelled is (approximately)",options:["A : 67 metres","B : 52 metres","C : 22.5 metres","D : Can’t be determined"],correct:"A"},
{id:667,origId:150,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"A and B walk from X to Y, a distance of 27 km at 5 kmph and 7 kmph respectively. B reaches Y and immediately turns back meeting A at Z. What is the distance from X to Z?",options:["A : 25 km","B : 22.5 km","C : 24 km","D : 20 km"],correct:"B"},
{id:668,origId:151,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"There is leak in the bottom of a tank. This leak can empty a full tank in 8 hours. When the tank is full, a tap is opened into the tank which admits 6 litres per hour and the tank is now emptied in 12 hours. What is the capacity of the tank?",options:["A : 28.8 litres","B : 36 litres","C : 144 litres","D : Can’t be determined"],correct:"C"},
{id:669,origId:152,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"1994",text:"The winning relay team in a high school sports competition clocked 48 minutes for a distance of 13.2 km. Its runners A, B, C and D maintained speeds of 15 kmph, 16 kmph, 17 kmph, and 18 kmph respectively. What is the ratio of the time taken by B to time taken by D?",options:["A : 5 : 16","B : 5 : 17","C : 9 : 8","D : 8 : 9"],correct:"C"}
