{id:391,origId:85,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2001",text:"Three friends, returning from a movie, stopped to eat at a restaurant. After dinner, they paid their bill and noticed a bowl of mints at the front counter. Sita took 1/3 of the mints, but returned four because she had a momentary pang of guilt. Fatima then took 1/4 of what was left but returned three for similar reasons. Eswari then took half of the remainder but threw two back into the bowl. The bowl had only 17 mints left when the raid was over. How many mints were originally in the bowl?",options:["A : 38","B : 31","C : 41","D : None of these"],correct:"D"},
{id:392,origId:86,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2001",text:"Three maths classes: X, Y and Z take an algebra test. The average score in class X is 83. The average score in class Y is 76. The average score in class Z is 85. The average score of all students in classes X and Y together is 79. The average score of all students in classes Y and Z together is 81. What is the average for all the three classes?",options:["A : 81","B : 81.5","C : 82","D : 84.5"],correct:"B"},
{id:393,origId:87,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2001",text:"A set of consecutive positive integers beginning with 1 is written on the blackboard. A student came along and erased one number. The average of the remaining numbers is 35 17/7 . What was the number erased?",options:["A : 7","B : 8","C : 9","D : None of these"],correct:"A"},
{id:394,origId:88,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"2000",text:"There are seven consecutive natural numbers such that the average of the first five is n. Then average of all seven numbers will be?",options:["A : n","B : n+1","C : kn + 1/k where k is a positive constant.","D : n + 2/7"],correct:"B"},
{id:395,origId:89,meta:"CAT/1999(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1999",text:"Mr Launcher plans to launch a new TV channel called Dekha Dekhi (DD). He envisages a viewership of 42%. He plans to capture the viewership from CAT TV and MAT TV, which currently hold viewership of 35% and 48%, each having a distinct and separate target audience. In what ratio should he capture the target audience of the two channels",options:["A : 6:7","B : 7:6","C : 1:1","D : 8:9"],correct:"A"},
{id:396,origId:90,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1998",text:"I have one rupee coins, fifty paise coins and twenty five paise coins. The number of coins are in the ratio 2.5 : 3 : 4. If the total amount with me is Rs 210. Find the number of one rupee coins.",options:["A : 90","B : 85","C : 100","D : 105"],correct:"D"},
{id:397,origId:91,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1998",text:"There are two containers : the first contains 500 ml of alcohol, while the second contains 500 ml of water. Three cups of alcohol from the first container is removed and is mixed well in the second container. Then three cups of this mixture is removed and is mixed in the first container. Let ‘A’ denote the proportion of water in the first container and ‘B’ denote the proportion of alcohol in the second container. Then,",options:["A : A > B","B : A < B","C : A = B","D : Cannot be determined"],correct:"C"},
{id:398,origId:92,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1997",text:"There are 60 students in a class. These students are divided into three groups A, B and C of 15, 20 and 25 students each. The groups A and C are combined to form group D. What is the average weight of the students in group D?",options:["A : more than the average weight of A","B : more than the average weight of C","C : less than the average weight of C","D : Cannot be determined"],correct:"D"},
{id:399,origId:93,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1997",text:"There are 60 students in a class. These students are divided into three groups A, B and C of 15, 20 and 25 students each. The groups A and C are combined to form group D.  If one student from Group A is shifted to group B, which of the following will be true?",options:["A : The average weight of both groups increases","B : The average weight of both the groups decreases","C : The average weight of the class remains the same","D : Cannot be determined"],correct:"C"},
{id:400,origId:94,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1997",text:"There are 60 students in a class. These students are divided into three groups A, B and C of 15, 20 and 25 students each. The groups A and C are combined to form group D.  If all the students of the class have the same weight, then which of the following is false?",options:["A : The average weight of all the four groups is the same","B : The total weight of A and C is twice the total weight of B.","C : The average weight of D is greater than the average weight of A.","D : The average weight of all the groups remains the same even if the number of students are shifted from one group to another."],correct:"C"},
{id:401,origId:95,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1994",text:"Alphonso, on his death bed, keeps half his property for his wife and divides the rest equally among his three sons Ben, Carl and Dave. Some years later Ben dies leaving half his property to his widow and half to his brothers Carl and Dave together, shared equally. When Carl makes his will he keeps half his property for his widow and the rest he bequeaths to his younger brother Dave. When Dave dies some years later, he keeps half his property for his widow and the remaining for his mother. The mother now has Rs 1,575,000. What was the worth of the total property?",options:["A : Rs 30 lakh","B : Rs 8 lakh","C : Rs 18 lakh","D : Rs 24 lakh"],correct:"D"},
{id:402,origId:96,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1994",text:"Alphonso, on his death bed, keeps half his property for his wife and divides the rest equally among his three sons Ben, Carl and Dave. Some years later Ben dies leaving half his property to his widow and half to his brothers Carl and Dave together, shared equally. When Carl makes his will he keeps half his property for his widow and the rest he bequeaths to his younger brother Dave. When Dave dies some years later, he keeps half his property for his widow and the remaining for his mother. The mother now has Rs 1,575,000. What was Carl’s original share?",options:["A : Rs 4 lakh","B : Rs 12 lakh","C : Rs 6 lakh","D : Rs 5 lakh"],correct:"A"},
{id:403,origId:97,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Averages, Ratio & Proportion",year:"1994",text:"Alphonso, on his death bed, keeps half his property for his wife and divides the rest equally among his three sons Ben, Carl and Dave. Some years later Ben dies leaving half his property to his widow and half to his brothers Carl and Dave together, shared equally. When Carl makes his will he keeps half his property for his widow and the rest he bequeaths to his younger brother Dave. When Dave dies some years later, he keeps half his property for his widow and the remaining for his mother. The mother now has Rs 1,575,000. What was the ratio of the property owned by the widows of the three sons, in the end?",options:["A : 7 : 9 : 13","B : 8 : 10 : 15","C : 5 : 7 : 9","D : 9 : 12 : 13"],correct:"B"},
{id:404,origId:1,meta:"CAT/2024.3(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2024",text:"Aman invests Rs 4000 in a bank at a certain rate of interest, compounded annually. If the ratio of the value of the investment after 3 years to the value of the investment after 5 years is 25 : 36, then the minimum number of years required for the value of the investment to exceed Rs 20000 is",options:null,correct:"9"},
{id:405,origId:2,meta:"CAT/2024.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2024",text:"Gopi marks a price on a product in order to make 20% profit. Ravi gets 10% discount on this marked price, and thus saves Rs 15. Then, the profit, in rupees, made by Gopi by selling the product to Ravi, is",options:["A : 25","B : 10","C : 15","D : 20"],correct:"B"},
{id:406,origId:3,meta:"CAT/2024.3(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2024",text:"The average of three distinct real numbers is 28. If the smallest number is increased by 7 and the largest number is reduced by 10, the order of the numbers remains unchanged, and the new arithmetic mean becomes 2 more than the middle number, while the difference between the largest and the smallest numbers becomes 64. Then, the largest number in the original set of three numbers is",options:null,correct:"70"},
{id:407,origId:4,meta:"CAT/2024.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2024",text:"Bina incurs 19% loss when she sells a product at Rs. 4860 to Shyam, who in turn sells this product to Hari. If Bina would have sold this product to Shyam at the purchase price of Hari, she would have obtained 17% profit. Then, the profit, in rupees, made by Shyam is",options:null,correct:"2160"},
{id:408,origId:5,meta:"CAT/2024.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2024",text:"A fruit seller has a stock of mangoes, bananas and apples with at least one fruit of each type. At the beginning of a day, the number of mangoes make up 40% of his stock. That day, he sells half of the mangoes, 96 bananas and 40% of the apples. At the end of the day, he ends up selling 50% of the fruits. The smallest possible total number of fruits in the stock at the beginning of the day is",options:null,correct:"340"},
{id:409,origId:6,meta:"CAT/2024.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2024",text:"Anil invests Rs 22000 for 6 years in a scheme with 4% interest per annum, compounded half-yearly. Separately, Sunil invests a certain amount in the same scheme for 5 years, and then reinvests the entire amount he receives at the end of 5 years, for one year at 10% simple interest. If the amounts received by both at the end of 6 years are equal, then the initial investment, in rupees, made by Sunil is",options:["A : 20480","B : 20808","C : 20640","D : 20860"],correct:"B"},
{id:410,origId:7,meta:"CAT/2024.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2024",text:"An amount of Rs 10000 is deposited in bank A for a certain number of years at a simple interest of 5% per annum. On maturity, the total amount received is deposited in bank B for another 5 years at a simple interest of 6% per annum. If the interests received from bank A and bank B are in the ratio 10 : 13, then the investment period, in years, in bank A is",options:["A : 4","B : 5","C : 3","D : 6"],correct:"D"},
{id:411,origId:8,meta:"CAT/2024.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2024",text:"A shop wants to sell a certain quantity (in kg) of grains. It sells half the quantity and an additional 3 kg of these grains to the first customer. Then, it sells half of the remaining quantity and an additional 3 kg of these grains to the second customer. Finally, when the shop sells half of the remaining quantity and an additional 3 kg of these grains to the third customer, there are no grains left. The initial quantity, in kg, of grains is",options:["A : 18","B : 36","C : 42","D : 50"],correct:"C"},
{id:412,origId:9,meta:"CAT/2024.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2024",text:"The selling price of a product is fixed to ensure 40% profit. If the product had cost 40% less and had been sold for 5 rupees less, then the resulting profit would have been 50%. The original selling price, in rupees, of the product is",options:["A : 10","B : 15","C : 20","D : 14"],correct:"D"},
{id:413,origId:10,meta:"CAT/2023.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2023",text:"<img src='images/images_question_images_4418_question_11TkSuQmCC1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 72000","B : 73000","C : 74000","D : 75000"],correct:"B"},
{id:414,origId:11,meta:"CAT/2023.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2023",text:"A merchant purchases a cloth at a rate of Rs.100 per meter and receives 5 cm length of cloth free for every 100 cm length of cloth purchased by him. He sells the same cloth at a rate of Rs.110 per meter but cheats his customers by giving 95 cm length of cloth for every 100 cm length of cloth purchased by the customers. If the merchant provides a 5% discount, the resulting profit earned by him is",options:["A : 9.7%","B : 4.2%","C : 16%","D : 15.5%"],correct:"D"},
{id:415,origId:12,meta:"CAT/2023.3(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2023",text:"A fruit seller has a stock of mangoes, bananas and apples with at least one fruit of each type. At the beginning of a day, the number of mangoes make up 40% of his stock. That day, he sells half of the mangoes, 96 bananas and 40% of the apples. At the end of the day, he ends up selling 50% of the fruits. The smallest possible total number of fruits in the stock at the beginning of the day is",options:null,correct:"340"},
{id:416,origId:13,meta:"CAT/2023.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2023",text:"Anil borrows Rs 2 lakhs at an interest rate of 8% per annum, compounded half-yearly. He repays Rs 10320 at the end of the first year and closes the loan by paying the outstanding amount at the end of the third year. Then, the total interest, in rupees, paid over the three years is nearest to",options:["A : 33130","B : 40991","C : 45311","D : 51311"],correct:"D"},
{id:417,origId:14,meta:"CAT/2023.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2023",text:"Minu purchases a pair of sunglasses at Rs.1000 and sells to Kanu at 20% profit. Then, Kanu sells it back to Minu at 20% loss. Finally, Minu sells the same pair of sunglasses to Tanu. If the total profit made by Minu from all her transactions is Rs.500, then the percentage of profit made by Minu when she sold the pair of sunglasses to Tanu is",options:null,correct:"16"},
{id:418,origId:15,meta:"CAT/2023.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2023",text:"Jayant bought a certain number of white shirts at the rate of Rs 1000 per piece and a certain number of blue shirts at the rate of Rs 1125 per piece. For each shirt, he then set a fixed market price which was 25% higher than the average cost of all the shirts. He sold all the shirts at a discount of 10% and made a total profit of Rs 51000. If he bought both colors of shirts, then the maximum possible total number of shirts that he could have bought is",options:null,correct:"407"},
{id:419,origId:16,meta:"CAT/2023.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2023",text:"The salaries of three friends Sita, Gita and Mita are initially in the ratio 5 : 6 : 7, respectively. In the first year, they get salary hikes of 20%, 25% and 20%, respectively. In the second year, Sita and Mita get salary hikes of 40% and 25%, respectively, and the salary of Gita becomes equal to the mean salary of the three friends. The salary hike of Gita in the second year is",options:["A : 30%","B : 26%","C : 25%","D : 28%"],correct:"B"},
{id:420,origId:17,meta:"CAT/2023.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2023",text:"Gita sells two objects A and B at the same price such that she makes a profit of 20% on object A and a loss of 10% on object B. If she increases the selling price such that objects A and B are still sold at an equal price and a profit of 10% is made on object B, then the profit made on object A will be nearest to",options:["A : 45%","B : 47%","C : 49%","D : 42%"],correct:"B"},
{id:421,origId:18,meta:"CAT/2022.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2022",text:"<img src='images/images_question_images_4266_question_1RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 700","B : 900","C : 1000","D : 800"],correct:"D"},
{id:422,origId:19,meta:"CAT/2022.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2022",text:"Manu earns ₹4000 per month and wants to save an average of ₹550 per month in a year. In the first nine months, his monthly expense was ₹3500, and he foresees that, tenth month onward, his monthly expense will increase to ₹3700. In order to meet his yearly savings target, his monthly earnings, in rupees, from the tenth month onward should be",options:["A : 4400","B : 4200","C : 4300","D : 4350"],correct:"A"},
{id:423,origId:20,meta:"CAT/2022.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2022",text:"Mr. Pinto invests one-fifth of his capital at 6%, one-third at 10% and the remaining at 1%, each rate being simple interest per annum. Then, the minimum number of years required for the cumulative interest income from these investments to equal or exceed his initial capital is",options:null,correct:"20"},
{id:424,origId:21,meta:"CAT/2022.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2022",text:"In an election, there were four candidates and 80% of the registered voters casted their votes. One of the candidates received 30% of the casted votes while the other three candidates received the remaining casted votes in the proportion 1 : 2 : 3. If the winner of the election received 2512 votes more than the candidate with the second highest votes, then the number of registered voters was",options:["A : 50240","B : 60288","C : 40192","D : 62800"],correct:"D"},
{id:425,origId:22,meta:"CAT/2022.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2022",text:"Alex invested his savings in two parts. The simple interest earned on the first part at 15% per annum for 4 years is the same as the simple interest earned on the second part at 12% per annum for 3 years. Then, the percentage of his savings invested in the first part is",options:["A : 60%","B : 37.5%","C : 62.5%","D : 40%"],correct:"B"},
{id:426,origId:23,meta:"CAT/2022.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2022",text:"Ankita buys 4 kg cashews, 14 kg peanuts and 6 kg almonds when the cost of 7 kg cashews is the same as that of 30 kg peanuts or 9 kg almonds. She mixes all the three nuts and marks a price for the mixture in order to make a profit of ₹1752. She sells 4 kg of the mixture at this marked price and the remaining at a 20% discount on the marked price, thus making a total profit of ₹744. Then the amount, in rupees, that she had spent in buying almonds is",options:["A : 1176","B : 1440","C : 2520","D : 1680"],correct:"D"},
{id:427,origId:24,meta:"CAT/2022.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2022",text:"Amal buys 110 kg of syrup and 120 kg of juice, syrup being 20% less costly than juice, per kg. He sells 10 kg of syrup at 10% profit and 20 kg of juice at 20% profit. Mixing the remaining juice and syrup, Amal sells the mixture at ₹ 308.32 per kg and makes an overall profit of 64%. Then, Amal’s cost price for syrup, in rupees per kg, is",options:null,correct:"160"},
{id:428,origId:25,meta:"CAT/2021.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"Anil invests some money at a fixed rate of interest, compounded annually. If the interests accrued during the second and third year are ₹ 806.25 and ₹ 866.72, respectively, the interest accrued, in INR, during the fourth year is nearest to",options:["A : 934.65","B : 931.72","C : 926.84","D : 929.48"],correct:"B"},
{id:429,origId:26,meta:"CAT/2021.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"Identical chocolate pieces are sold in boxes of two sizes, small and large. The large box is sold for twice the price of the small box. If the selling price per gram of chocolate in the large box is 12% less than that in the small box, then the percentage by which the weight of chocolate in the large box exceeds that in the small box is nearest to",options:["A : 124","B : 144","C : 135","D : 127"],correct:"D"},
{id:430,origId:27,meta:"CAT/2021.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2021",text:"Amal purchases some pens at ₹ 8 each. To sell these, he hires an employee at a fixed wage. He sells 100 of these pens at ₹ 12 each. If the remaining pens are sold at ₹ 11 each, then he makes a net profit of ₹ 300, while he makes a net loss of ₹ 300 if the remaining pens are sold at ₹ 9 each. The wage of the employee, in INR, is",options:null,correct:"1000"},
{id:431,origId:28,meta:"CAT/2021.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2021",text:"The strength of an indigo solution in percentage is equal to the amount of indigo in grams per 100 cc of water. Two 800 cc bottles are filled with indigo solutions of strengths 33% and 17%, respectively. A part of the solution from the first bottle is thrown away and replaced by an equal volume of the solution from the second bottle. If the strength of the indigo solution in the first bottle has now changed to 21% then the volume, in cc, of the solution left in the second bottle is",options:null,correct:"200"},
{id:432,origId:29,meta:"CAT/2021.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"A basket of 2 apples, 4 oranges, and 6 mangoes costs the same as a basket of 1 apple, 4 oranges, and 8 mangoes, or a basket of 8 oranges and 7 mangoes. Then the number of mangoes in a basket of mangoes that has the same cost as the other baskets is",options:["A : 12","B : 13","C : 11","D : 10"],correct:"B"},
{id:433,origId:30,meta:"CAT/2021.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"A person buys tea of three different qualities at ₹ 800, ₹ 500, and ₹ 300 per kg, respectively, and the amounts bought are in the proportion 2 : 3 : 5. She mixes all the tea and sells one-sixth of the mixture at ₹ 700 per kg. The price, in INR per kg, at which she should sell the remaining tea, to make an overall profit of 50%, is",options:["A : 675","B : 692","C : 688","D : 653"],correct:"C"},
{id:434,origId:31,meta:"CAT/2021.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"Raj invested ₹ 10000 in a fund. At the end of first year, he incurred a loss but his balance was more than ₹ 5000. This balance, when invested for another year, grew and the percentage of growth in the second year was five times the percentage of loss in the first year. If the gain of Raj from the initial investment over the two year period is 35%, then the percentage of loss in the first year is",options:["A : 15","B : 10","C : 5","D : 70"],correct:"B"},
{id:435,origId:32,meta:"CAT/2021.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"Anil, Bobby, and Chintu jointly invest in a business and agree to share the overall profit in proportion to their investments. Anil’s share of investment is 70%. His share of profit decreases by ₹ 420 if the overall profit goes down from 18% to 15%. Chintu’s share of profit increases by ₹ 80 if the overall profit goes up from 15% to 17%. The amount, in INR, invested by Bobby is",options:["A : 2000","B : 2400","C : 1800","D : 2200"],correct:"A"},
{id:436,origId:33,meta:"CAT/2021.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"A shop owner bought a total of 64 shirts from a wholesale market that came in two sizes, small and large. The price of a small shirt was INR 50 less than that of a large shirt. She paid a total of INR 5000 for the large shirts, and a total of INR 1800 for the small shirts. Then, the price of a large shirt and a small shirt together, in INR, is",options:["A : 175","B : 200","C : 225","D : 150"],correct:"B"},
{id:437,origId:34,meta:"CAT/2021.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"One part of a hostel’s monthly expenses is fixed, and the other part is proportional to the number of its boarders. The hostel collects ₹ 1600 per month from each boarder. When the number of boarders is 50, the profit of the hostel is ₹ 200 per boarder, and when the number of boarders is 75, the profit of the hostel is ₹ 250 per boarder. When the number of boarders is 80, the total profit of the hostel, in INR, will be",options:["A : 20000","B : 20500","C : 20800","D : 20200"],correct:"B"},
{id:438,origId:35,meta:"CAT/2021.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"In a tournament, a team has played 40 matches so far and won 30% of them. If they win 60% of the remaining matches, their overall win percentage will be 50%. Suppose they win 90% of the remaining matches, then the total number of matches won by the team in the tournament will be",options:["A : 86","B : 80","C : 78","D : 84"],correct:"D"},
{id:439,origId:36,meta:"CAT/2021.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2021",text:"Bank A offers 6% interest rate per annum compounded half yearly. Bank B and Bank C offer simple interest but the annual interest rate offered by Bank C is twice that of Bank B. Raju invests a certain amount in Bank B for a certain period and Rupa invests ₹ 10,000 in Bank C for twice that period. The interest that would accrue to Raju during that period is equal to the interest that would have accrued had he invested the same amount in Bank A for one year. The interest accrued, in INR, to Rupa is",options:["A : 3436","B : 2346","C : 2436","D : 1436"],correct:"C"},
{id:440,origId:37,meta:"CAT/2020.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2020",text:"Veeru invested Rs 10000 at 5% simple annual interest, and exactly after two years, Joy invested Rs 8000 at 10% simple annual interest. How many years after Veeru’s investment, will their balances, i.e., principal plus accumulated interest, be equal?",options:null,correct:"12"},
{id:441,origId:38,meta:"CAT/2020.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2020",text:"A person spent Rs 50000 to purchase a desktop computer and a laptop computer. He sold the desktop at 20% profit and the laptop at 10% loss. If overall he made a 2% profit then the purchase price, in rupees, of the desktop is",options:null,correct:"20000"},
{id:442,origId:39,meta:"CAT/2020.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2020",text:"In a group of people, 28% of the members are young while the rest are old. If 65% of the members are literates, and 25% of the literates are young, then the percentage of old people among the illiterates is nearest to",options:["A : 59","B : 62","C : 66","D : 55"],correct:"C"},
{id:443,origId:40,meta:"CAT/2020.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2020",text:"For the same principal amount, the compound interest for two years at 5% per annum exceeds the simple interest for three years at 3% per annum by Rs 1125. Then the principal amount in rupees is",options:null,correct:"90000"},
{id:444,origId:41,meta:"CAT/2020.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2020",text:"Anil buys 12 toys and labels each with the same selling price. He sells 8 toys initially at 20% discount on the labeled price. Then he sells the remaining 4 toys at an additional 25% discount on the discounted price. Thus, he gets a total of Rs 2112, and makes a 10% profit. With no discounts, his percentage of profit would have been",options:["A : 60","B : 50","C : 55","D : 54"],correct:"B"},
{id:445,origId:42,meta:"CAT/2020.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2020",text:"In May, John bought the same amount of rice and the same amount of wheat as he had bought in April, but spent 150 more due to price increase of rice and wheat by 20% and 12%, respectively. If John had spent 450 on rice in April, then how much did he spend on wheat in May?",options:["A : 590","B : 580","C : 560","D : 570"],correct:"C"},
{id:446,origId:43,meta:"CAT/2020.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2020",text:"In the final examination, Bishnu scored 52% and Asha scored 64%. The marks obtained by Bishnu is 23 less, and that by Asha is 34 more than the marks obtained by Ramesh. The marks obtained by Geeta, who scored 84%, is",options:["A : 399","B : 439","C : 357","D : 417"],correct:"A"},
{id:447,origId:44,meta:"CAT/2020.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2020",text:"A man buys 35 kg of sugar and sets a marked price in order to make a 20% profit. He sells 5 kg at this price, and 15 kg at a 10% discount. Accidentally, 3 kg of sugar is wasted. He sells the remaining sugar by raising the marked price by p percent so as to make an overall profit of 15%. Then p is nearest to",options:["A : 35","B : 31","C : 22","D : 25"],correct:"D"},
{id:448,origId:45,meta:"CAT/2020.3(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2020",text:"Two alcohol solutions, A and B, are mixed in the proportion 1:3 by volume. The volume of the mixture is then doubled by adding solution A such that the resulting mixture has 72% alcohol. If solution A has 60% alcohol, then the percentage of alcohol in solution B is",options:["A : 94%","B : 92%","C : 90%","D : 89%"],correct:"B"},
{id:449,origId:46,meta:"CAT/2020.3(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2020",text:"A person invested a certain amount of money at 10% annual interest, compounded half-yearly. After one and a half years, the interest and principal together became Rs 18522. The amount, in rupees, that the person had invested is",options:null,correct:"16000"},
{id:450,origId:47,meta:"CAT/2019.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2019",text:"In a class, 60% of the students are girls and the rest are boys. There are 30 more girls than boys. If 68% of the students, including 30 boys,pass an examination, the percentage of the girls who do not pass is",options:null,correct:"20"},
{id:451,origId:48,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2019",text:"Meena scores 40% in an examination and after review, even though her score is increased by 50%, she fails by 35 marks. If her post-review score is increased by 20%, she will have 7 marks more than the passing score. The percentage score needed for passing the examination is",options:["A : 75","B : 80","C : 60","D : 70"],correct:"D"},
{id:452,origId:49,meta:"CAT/2019.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2019",text:"A person invested a total amount of Rs 15 lakh. A part of it was invested in a fixed deposit earning 6% annual interest, and the remaining amount was invested in two other deposits in the ratio 2 : 1, earning annual interest at the rates of 4% and 3%, respectively. If the total annual interest income is Rs 76000 then the amount (in Rs lakh) invested in the fixed deposit was",options:null,correct:"9"},
{id:453,origId:50,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2019",text:"On selling a pen at 5% loss and a book at 15% gain, Karim gains Rs. 7. If he sells the pen at 5% gain and the book at 10% gain, he gains Rs. 13. What is the cost price of the book in Rupees?",options:["A : 80","B : 85","C : 100","D : 95"],correct:"A"},
{id:454,origId:51,meta:"CAT/2019.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2019",text:"The income of Amala is 20% more than that of Bimala and 20% less than that of Kamala. If Kamala's income goes down by 4% and Bimala's goes up by 10%, then the percentage by which Kamala's income would exceed Bimala's is nearest to",options:["A : 28","B : 29","C : 31","D : 32"],correct:"C"},
{id:455,origId:52,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2019",text:"In 2010, a library contained a total of 11500 books in two categories - fiction and non-fiction. In 2015, the library contained a total of 12760 books in these two categories. During this period, there was 10% increase in the fiction category while there was 12% increase in the non-fiction category. How many fiction books were in the library in 2015?",options:["A : 6600","B : 6150","C : 6500","D : 5500"],correct:"A"},
{id:456,origId:53,meta:"CAT/2019.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2019",text:"In an examination, the score of A was 10% less than that of B, the score of B was 25% more than that of C, and the score of C was 20% less than that of D. If A scored 72, then the score of D was",options:null,correct:"80"},
{id:457,origId:54,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2019",text:"Mukesh purchased 10 bicycles in 2017, all at the same price. He sold six of these at a profit of 25% and the remaining four at a loss of 25%. If he made a total profit of Rs. 2000, then his purchase price of a bicycle, in Rupees, was",options:["A : 2000","B : 6000","C : 8000","D : 4000"],correct:"D"},
{id:458,origId:55,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2019",text:"The strength of a salt solution is p% if 100 ml of the solution contains p grams of salt. Each of three vessels A, B, C contains 500 ml of salt solution of strengths 10%, 22%, and 32%, respectively. Now, 100 ml of the solution in vessel A is transferred to vessel B. Then, 100 ml of the solution in vessel B is transferred to vessel C. Finally, 100 ml of the solution in vessel C is transferred to vessel A. The strength, in percentage, of the resulting solution in vessel A is",options:["A : 15","B : 12","C : 13","D : 14"],correct:"D"},
{id:459,origId:56,meta:"CAT/2019.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2019",text:"Amal invests Rs 12000 at 8% interest, compounded annually, and Rs 10000 at 6% interest, compounded semi-annually, both investments being for one year. Bimal invests his money at 7.5% simple interest for one year. If Amal and Bimal get the same amount of interest, then the amount, in Rupees, invested by Bimal is",options:null,correct:"20920"},
{id:460,origId:57,meta:"CAT/2019.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2019",text:"A shopkeeper sells two tables, each procured at cost price p, to Amal and Asim at a profit of 20% and at a loss of 20%, respectively. Amal sells his table to Bimal at a profit of 30%, while Asim sells his table to Barun at a loss of 30%. If the amounts paid by Bimal and Barun are x and y, respectively, then (x - y) / p equals",options:["A : 1","B : 1.2","C : 0.7","D : 0.50"],correct:"A"},
{id:461,origId:58,meta:"CAT/2018.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2018",text:"J ohn borrowed Rs. 2,10,000 from a bank at an interest rate of 10% per annum, compounded annually. The loan was repaid in two equal instalments, the first after one year and the second after another year. The ﬁrst instalment was interest of one year plus part of the principal amount, while the second was the rest of the principal amount plus due interest thereon. Then each instalment, in Rs., is",options:null,correct:"121000"},
{id:462,origId:59,meta:"CAT/2018.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2018",text:"In an examination, the maximum possible score is N while the pass mark is 45% of N. A candidate obtains 36 marks, but falls short of the pass mark by 68%. Which one of the following is then correct?",options:["A : N ≤ 200","B : 243 ≤ N ≤ 252","C : N ≥ 253","D : 201 ≤ N ≤ 242"],correct:"B"},
{id:463,origId:60,meta:"CAT/2018.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2018",text:"A jar contains a mixture of 175 ml water and 700 ml alcohol. Gopal takes out 10% of the mixture and substitutes it by water of the same amount. The process is repeated once again. The percentage of water in the mixture is now",options:["A : 25.4","B : 20.5","C : 30.3","D : 35.2"],correct:"D"},
{id:464,origId:61,meta:"CAT/2018.2(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2018",text:"Gopal borrows Rs. X from Ankit at 8% annual interest. He then adds Rs. Y of his own money and lends Rs. X+Y to Ishan at 10% annual interest. At the end of the year, after returning Ankit’s dues, the net interest retained by Gopal is the same as that accrued to Ankit. On the other hand, had Gopal lent Rs. X+2Y to Ishan at 10%, then the net interest retained by him would have increased by Rs. 150. If all interests are compounded annually, then find the value of X + Y.",options:null,correct:"4000"},
{id:465,origId:62,meta:"CAT/2017.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2017",text:"Arun's present age in years is 40% of Barun's. In another few years, Arun's age will be half of Barun's. By what percentage will Barun's age increase during this period?",options:null,correct:"20"},
{id:466,origId:63,meta:"CAT/2017.1(Quantitative Ability)",type:"TITA",topic:"Percentage, Profit & Loss",year:"2017",text:"Ravi invests 50% of his monthly savings in fixed deposits. Thirty percent of the rest of his savings is invested in stocks and the rest goes into Ravi's savings bank account. If the total amount deposited by him in the bank (for savings account and fixed deposits) is Rs 59500, then Ravi's total monthly savings (in Rs) is:",options:null,correct:"70000"},
{id:467,origId:64,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"If a seller gives a discount of 15% on retail price, she still makes a profit of 2%. Which of the following ensures that she makes a profit of 20%?",options:["A : Give a discount of 5% on retail price","B : Give a discount of 2% on retail price","C : Increase the retail price by 2%","D : Sell at retail price"],correct:"D"},
{id:468,origId:65,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"The number of girls appearing for an admission test is twice the number of boys. If 30% of the girls and 45% of the boys get admission, the percentage of candidates who do not get admission is:",options:["A : 35","B : 50","C : 60","D : 65"],correct:"D"},
{id:469,origId:66,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"In a market, the price of medium quality mangoes is half that of good mangoes. A shopkeeper buys 80 kg good mangoes and 40 kg medium quality mangoes from the market and then sells all these at a common price which is 10% less than the price at which he bought the good ones. His overall profit is:",options:["A : 6%","B : 8%","C : 10%","D : 12%"],correct:"B"},
{id:470,origId:67,meta:"CAT/2017.1(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"If Fatima sells 60 identical toys at a 40% discount on the printed price, then she makes 20% profit. Ten of these toys are destroyed in fire. While selling the rest, how much discount should be given on the printed price so that she can make the same amount of profit?",options:["A : 30%","B : 25%","C : 24%","D : 28%"],correct:"D"},
{id:471,origId:68,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"Out of the shirts produced in a factory, 15% are defective, while 20% of the rest are sold in the domestic market. If the remaining 8840 shirts are left for export, then the number of shirts produced in the factory is",options:["A : 13600","B : 13400","C : 13000","D : 14000"],correct:"C"},
{id:472,origId:69,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"The manufacturer of a table sells it to a wholesale dealer at a profit of 10%. The wholesale dealer sells the table to a retailer at a profit of 30%. Finally, the retailer sells it to a customer at a profit of 50%. If the customer pays Rs 4290 for the table, then its manufacturing cost (in Rs) is",options:["A : 1500","B : 2000","C : 2500","D : 3000"],correct:"B"},
{id:473,origId:70,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"Mayank buys some candies for Rs 15 a dozen and an equal number of different candies for Rs 12 a dozen. He sells all for Rs 16.50 a dozen and makes a profit of Rs 150. How many dozens of candies did he buy altogether?",options:["A : 50","B : 30","C : 25","D : 45"],correct:"A"},
{id:474,origId:71,meta:"CAT/2017.2(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2017",text:"In a village, the production of food grains increased by 40% and the per capita production of food grains increased by 27% during a certain period. The percentage by which the population of the village increased during the same period is nearest to",options:["A : 16","B : 13","C : 10","D : 7"],correct:"C"},
{id:475,origId:72,meta:"CAT/2008(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2008",text:"Which of the following cannot be true?",options:["A : At least two horses finished before Spotted","B : Red finished last","C : There were three horses between Black and Spotted","D : There were three horses between White and Red","E : Grey came in second"],correct:"D"},
{id:476,origId:73,meta:"CAT/2008(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2008",text:"Suppose, in addition, it is known that Grey came in fourth. Then which of the following cannot be true?",options:["A : Spotted came in first","B : Red finished last","C : White came in second","D : Black came in second","E : There was one horse between Black and White"],correct:"C"},
{id:477,origId:74,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2007",text:"The maximum guaranteed return to Shabnam is",options:["A : 0.25%","B : 0.10%","C : 0.20%","D : 0.15%","E : 0.30%"],correct:"C"},
{id:478,origId:75,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2007",text:"What strategy will maximize the guaranteed return to Shabnam?",options:["A : 100% in option A","B : 36% in option B and 64% in option C","C : 64% in option B and 36% in option C","D : 1/3 in each of the three options","E : 30% in option A, 32% in option B and 38% in option C"],correct:"B"},
{id:479,origId:76,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2007",text:"How many units should Mr. David produce daily?",options:["A : 130","B : 100","C : 70","D : 150","E : Cannot be determined"],correct:"B"},
{id:480,origId:77,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2007",text:"What is the maximum daily profit, in rupees, that Mr. David can realize from his business?",options:["A : 620","B : 920","C : 840","D : 760","E : Cannot be determined."],correct:"D"},
{id:481,origId:78,meta:"CAT/2007(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2007",text:"The price of Darjeeling tea (in rupees per kilogram) is 100 + 0.10n, on the n th day of 2007 (n = 1, 2, ..., 100), and then remains constant. On the other hand, the price of Ooty tea (in rupees per kilogram) is 89 + 0.15n, on the n th day of 2007 (n = 1, 2, ..., 365). On which date in 2007 will the prices of these two varieties of tea be equal?",options:["A : May 21","B : April 11","C : May 20","D : April 10","E : June 30"],correct:"C"},
{id:482,origId:79,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2003",text:"At the end of year 1998, Shepard bought nine dozen goats. Henceforth, every year he added p% of the goats at the beginning of the year and sold q % of the goats at the end of the year where p > 0 and q > 0. If Shepard had nine dozen goats at the end of year 2002, after making the sales for that year, which of the following is true?",options:["A : p = q","B : p < q","C : p > q","D : p = q/2"],correct:"C"},
{id:483,origId:80,meta:"CAT/2003(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2003",text:"A leather factory produces two kinds of bags, standard and deluxe bag. The profit margin is Rs 20 on a standard bag and Rs 30 on a deluxe bag. Every bag must be processed on machine A and on machine B. The processing times per bag on the two machines are as follows: <img src='images/images_question_images_2962_question_rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'> The total time available on machine A is 700 hours and on machine B is 1250 hours. Among the following production plans, which one meets the machine availability constraints and maximizes the profit?",options:["A : Standard 75 bags, Deluxe 80 bags","B : Standard 100 bags, Deluxe 60 bags","C : Standard 50 bags, Deluxe 100 bags","D : Standard 60 bags, Deluxe 90 bags."],correct:"A"},
{id:484,origId:81,meta:"CAT/2002(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2002",text:"Davji Shop sells Samosas in boxes of different sizes. The Samosas are priced at Rs 2 per Samosa up to 200 Samosas. For every additional 20 Samosas, the price of the whole lot goes down by 10 paise per Samosa. What should be the maximum size of the box that would maximise the revenue?",options:["A : 240","B : 300","C : 400","D : None"],correct:"B"},
{id:485,origId:82,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2001",text:"A student took five papers in an examination, where the full marks were the same for each paper. His marks in these papers were in the proportion of 6 : 7 : 8 : 9 : 10. In all papers together, the candidate obtained 60% of the total marks. Then the number of papers in which he got more than 50% marks is",options:["A : 2","B : 3","C : 4","D : 5"],correct:"C"},
{id:486,origId:83,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2001",text:"A college has raised 75% of the amount it needs for a new building by receiving an average donation of Rs 600 from the people already solicited. The people already solicited represent 60% of the people, the college will ask for donations. If the college is to raise exactly the amount needed for the new building, what should be the average donation from the remaining people to be solicited?",options:["A : Rs 300","B : Rs 250","C : Rs 400","D : Rs 500"],correct:"A"},
{id:487,origId:84,meta:"CAT/2001(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2001",text:"The owner of an art shop conducts his business in the following manner. Every once in a while he raises his prices by X %, then a while later he reduces all the new prices by X %. After one such up-down cycle, the price of a painting decreased by Rs 441. After a second up-down cycle the painting was sold for Rs 1944.81. What was the original price of the painting?",options:["A : 2756.25","B : 2256.25","C : 2500","D : 2000"],correct:"A"},
{id:488,origId:85,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2000",text:"What is the average cost if number of widgets in July is 40?",options:["A : 110","B : 140","C : 3600","D : 180"],correct:"B"},
{id:489,origId:86,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2000",text:"If the number of widgets increase form 40 in July to 41 in September what is the marginal cost ?",options:["A : 110","B : 130","C : 170","D : 150"],correct:"D"},
{id:490,origId:87,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2000",text:"What is the total cost of production in July?",options:["A : 3600","B : 5600","C : 6400","D : 4300"],correct:"B"},
{id:491,origId:88,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2000",text:"What number of widgets give the maximum profit?",options:["A : 30","B : 40","C : 25","D : 60"],correct:"C"},
{id:492,origId:89,meta:"CAT/2000(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"2000",text:"What number of widgets being 0-60 which of the following is true?",options:["A : The average cost increases consistently","B : The average cost decreases consistently","C : The average cost decreases till minimum then increases","D : The average cost increases till maximum then decreases"],correct:"C"},
{id:493,origId:90,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1998",text:"One bacterium splits into eight bacteria of the next generation. But due to environment only 50% of one generation can produce the next generation. If the seventh generation number is 4096 million, then what is the number in first generation?",options:["A : 1 million","B : 2 million","C : 4 million","D : 8 million"],correct:"A"},
{id:494,origId:91,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1998",text:"A company purchases components A and B from Germany and USA respectively. A and B form 30% and 50% of the total production cost. Current gain is 20%. Due to change in the international scenario, cost of the German Mark increased by 30% and that of USA Dollar increased by 22%. Due to market conditions the selling price cannot be increased beyond 10%. Then What is the maximum current gain possible?",options:["A : 10%","B : 12.5%","C : 0%","D : 7.5%"],correct:"A"},
{id:495,origId:92,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1998",text:"A company purchases components A and B from Germany and USA respectively. A and B form 30% and 50% of the total production cost. Current gain is 20%. Due to change in the international scenario, cost of the German Mark increased by 30% and that of USA Dollar increased by 22%. Due to market conditions the selling price cannot be increased beyond 10%. Then If the USA Dollar becomes cheap by 12% over its original cost and the cost of German Mark increased by 20%. The selling price is not altered. What will be the gain?",options:["A : 10%","B : 20%","C : 15%","D : 7.5%"],correct:"B"},
{id:496,origId:93,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1998",text:"One bacterium splits into eight bacteria of the next generation. But due to environment only 50% of one generation can produce the next generation. If the seventh generation number is 4096 million, then what is the number in first generation?",options:["A : 1 million","B : 2 million","C : 4 million","D : 8 million"],correct:"A"},
{id:497,origId:94,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1998",text:"What is the maximum current gain possible?",options:["A : 10%","B : 12.5%","C : 0%","D : 7.5%"],correct:"A"},
{id:498,origId:95,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1998",text:"If the USA Dollar becomes cheap by 12% over its original cost and the cost of German Mark increased by 20%. The selling price is not altered. What will be the gain?",options:["A : 10%","B : 20%","C : 15%","D : 7.5%"],correct:"B"},
{id:499,origId:96,meta:"CAT/1998(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1998",text:"In a company 40% are male, out of which 75% earn a salary of 25,000 plus. If 45% of the employees 25,000 plus salaries, what is the fraction of female employees earning less than or equal to 25,000?",options:["A : 1/4","B : 3/7","C : 3/4","D : 5/9"],correct:"C"},
{id:500,origId:97,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1997",text:"A student gets an aggregate of 60% marks in five subjects in the ratio 10:9:8:7:6. If the passing marks are 50% of the maximum marks and each subject has the same maximum marks, in how many subjects did he pass the exam?",options:["A : 2","B : 3","C : 4","D : 5"],correct:"C"},
{id:501,origId:98,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1997",text:"After allowing a discount of 11.11%, a trader still makes a gain of 14.28%. At how many per cent above the cost price does he mark his goods?",options:["A : 28.56%","B : 35%","C : 22.22%","D : None of these"],correct:"A"},
{id:502,origId:99,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1997",text:"Fresh grapes contain 90% water while dry grapes contain 20% water. What is the weight of dry grapes obtained from 20 kg of fresh grapes?",options:["A : 2 kg","B : 2.5 kg","C : 2.4 kg","D : None of these"],correct:"B"},
{id:503,origId:100,meta:"CAT/1997(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1997",text:"A man earns x % on the first 2000 rupees and y % on the rest of his income. If he earns Rs 700 from Rs 4000 and Rs 900 from Rs 5000 of income, find x",options:["A : 20","B : 15","C : 25","D : None of these"],correct:"B"},
{id:504,origId:101,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1996",text:"I sold two watches for Rs 300 each, one at a loss of 10% and the other at a profit of 10%. What is the per cent loss (–) or the per cent profit (+) that resulted from the transaction ?",options:["A : (+) 10","B : (–) 1","C : (+) 1","D : 0"],correct:"B"},
{id:505,origId:102,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1996",text:"The price of a Maruti Car rises by 30% while the sales of the car come down by 20%. What is the per cent change in the total revenue?",options:["A : -4","B : -2","C : +4","D : +2"],correct:"C"},
{id:506,origId:103,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1996",text:"The cost of a diamond varies directly as the square of its weight. Once, this diamond broke into four pieces with weights in the ratio 1:2:3:4. When the pieces were sold, the merchant got Rs 70,000 less. Find the original price of the diamond.",options:["A : Rs 1.4 lakh","B : Rs 2.0 lakh","C : Rs 1.0 lakh","D : Rs 2.1 lakh"],correct:"C"},
{id:507,origId:104,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1996",text:"If he is able to sell only 1200 out of the 1500 watches he has made in the season, then in the season he has made a profit of",options:["A : Rs 90, 000","B : Rs75.000","C : Rs 45,000","D : Rs 60,000"],correct:"B"},
{id:508,origId:105,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1996",text:"If he produces 1500 watches, what is the number of watches that he must sell during the season in order to break even, given that he is able to sell all the watches produced?",options:["A : 500","B : 700","C : 800","D : 1000"],correct:"B"},
{id:509,origId:106,meta:"CAT/1996(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1996",text:"Instead of a metre scale cloth merchant uses a 120 cm scale while buying but uses an 80 cm scale while selling the same cloth. If he offers a discount of 20 per cent of cash payment, what is his overall per cent profit?",options:["A : 20%","B : 25%","C : 40%","D : 15%"],correct:"A"},
{id:510,origId:107,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1995",text:"A person who has a certain amount with him goes to the market. He can buy 50 oranges or 40 mangoes. He retains 10% of the amount as taxi fare and buys 20 mangoes and of the balance he purchases oranges. Number of oranges he can purchase is",options:["A : 36","B : 40","C : 15","D : 20"],correct:"D"},
{id:511,origId:108,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1995",text:"Ram purchased a flat at Rs 1 lakh and Prem purchase a plot of land worth Rs 1.1 lakh. The respective annual rates at which the prices of the falt and the plot increased were 10 % and 5%. After two years they exchanged their belongings and one paid the other the difference. Then...",options:["A : Ram paid Rs 275 to Prem","B : Ram paid Rs 475 to Prem","C : Ram paid Rs 2750 to Prem","D : Prem paid Rs Rs 475 to Ram"],correct:"A"},
{id:512,origId:109,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1995",text:"The rate of inflation was 1000%. Then, what will be cost of an article, which costs 6 units of currency now, two years from now?",options:["A : 666","B : 660","C : 720","D : 726"],correct:"D"},
{id:513,origId:110,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1995",text:"A man invests Rs 3000 at a rate of 5% per annum. How much more should he invest at a rate of 8%, so that he can earn a total of 6% per annum ?",options:["A : Rs 1200","B : Rs 1300","C : Rs 1500","D : Rs 2000"],correct:"C"},
{id:514,origId:111,meta:"CAT/1995(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1995",text:"2/5 of the voters promise to vote for P and the rest promised to vote for Q. Of these, on the last day 15% of the voters went back of their promise to vote for P and 25% of voters went back of their promise to vote for Q and P lost by 2 votes. Then the total number of voters is",options:["A : 100","B : 110","C : 90","D : 95"],correct:"A"},
{id:515,origId:112,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1994",text:"The number of votes not cast for the Praja Party increased by 25% in the National General Elections over those not cast for it in the previous Assembly Polls, and the Praja Party lost by a majority twice as large as that by which it had won the Assembly Polls. If a total of 2,60,000 people voted each time, how many voted for the Praja Party in the Assembly Elections?",options:["A : 1,10,000","B : 1,50,000","C : 1,40,000","D : 1,20,000"],correct:"C"},
{id:516,origId:113,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1994",text:"A dealer offers a cash discount of 20% and still makes a profit of 20%, when he further allows 16 articles to a dozen to a particularly sticky bargainer. How much per cent above the cost price were his wares listed?",options:["A : 100%","B : 80%","C : 75%","D : 66 2/3%"],correct:"A"},
{id:517,origId:114,meta:"CAT/1994(Quantitative Ability)",type:"MCQ",topic:"Percentage, Profit & Loss",year:"1994",text:"Last week Martin received $ 10 in commission for selling 100 copies of a magazine. Last week Miguiel sold 100 copies of this magazine. He received his salary of $ 5 per week plus a commission of 2 cents for each of the first 25 copies sold, 3 cents for each of next 25 copies sold and 4 cents for each copy thereafter. ($1 = 100 cents) (1994) I. Martin’s commission in the last week II. Miguiel’s total income for last week",options:["A : I > II","B : I < II","C : I = II","D : Nothing can be said"],correct:"A"},
{id:518,origId:1,meta:"CAT/2024.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2024",text:"Sam can complete a job in 20 days when working alone. Mohit is twice as fast as Sam and thrice as fast as Ayna in the same job. They undertake a job with an arrangement where Sam and Mohit work together on the first day, Sam and Ayna on the second day, Mohit and Ayna on the third day, and this three-day pattern is repeated till the work gets completed. Then, the fraction of total work done by Sam is",options:["A : 3/20","B : 3/10","C : 1/20","D : 1/5"],correct:"B"},
{id:519,origId:2,meta:"CAT/2024.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2024",text:"A train travelled a certain distance at a uniform speed. Had the speed been 6 km per hour more, it would have needed 4 hours less. Had the speed been 6 km per hour less, it would have needed 6 hours more. The distance, in km, travelled by the train is",options:["A : 780","B : 720","C : 640","D : 800"],correct:"B"},
{id:520,origId:3,meta:"CAT/2024.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2024",text:"Amal and Vimal together can complete a task in 150 days, while Vimal and Sunil together can complete the same task in 100 days. Amal starts working on the task and works for 75 days, then Vimal takes over and works for 135 days. Finally, Sunil takes over and completes the remaining task in 45 days. If Amal had started the task alone and worked on all days, Vimal had worked on every second day, and Sunil had worked on every third day, then the number of days required to complete the task would have been",options:null,correct:"139"},
{id:521,origId:4,meta:"CAT/2024.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2024",text:"A bus starts at 9 am and follows a fixed route every day. One day, it traveled at a constant speed of 60 km per hour and reached its destination 3.5 hours later than its scheduled arrival time. Next day, it traveled two-thirds of its route in one-third of its total scheduled travel time, and the remaining part of the route at 40 km per hour to reach just on time. The scheduled arrival time of the bus is",options:["A : 10 : 30 pm","B : 7 : 00 pm","C : 7 : 30 pm","D : 9 : 00 pm"],correct:"C"},
{id:522,origId:5,meta:"CAT/2024.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2024",text:"Three circles of equal radii touch (but not cross) each other externally. Two other circles, X\">X and Y\">Y, are drawn such that both touch (but not cross) each of the three previous circles. If the radius of X\">X is more than that of Y\">Y, the ratio of the radii of X\">X and Y\">Y is",options:["A : [IMG:images/question_images_4617_answer_16853_11RK5CYII=1.png]","B : [IMG:images/question_images_4617_answer_16854_11RK5CYII=1.png]","C : [IMG:images/question_images_4617_answer_16855_11TkSuQmCC1.png]","D : [IMG:images/question_images_4617_answer_16856_11rkJgggEQ1.png]"],correct:"C"},
{id:523,origId:6,meta:"CAT/2024.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2024",text:"Renu would take 15 days working 4 hours per day to complete a certain task whereas Seema would take 8 days working 5 hours per day to complete the same task. They decide to work together to complete this task. Seema agrees to work for double the number of hours per day as Renu, while Renu agrees to work for double the number of days as Seema. If Renu works 2 hours per day, then the number of days Seema will work, is",options:null,correct:"6"},
{id:524,origId:7,meta:"CAT/2024.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2024",text:"Two places A and B are 45 kms apart and connected by a straight road. Anil goes from A to B while Sunil goes from B to A. Starting at the same time, they cross each other in exactly 1 hour 30 minutes. If Anil reaches B exactly 1 hour 15 minutes after Sunil reaches A, the speed of Anil, in km per hour, is",options:["A : 18","B : 16","C : 14","D : 12"],correct:"D"},
{id:525,origId:8,meta:"CAT/2024.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2024",text:"Rahul, Rakshita and Gurmeet, working together, would have taken more than 7 days to finish a job. On the other hand, Rahul and Gurmeet, working together would have taken less than 15 days to finish the job. However, they all worked together for 6 days, followed by Rakshita, who worked alone for 3 more days to finish the job. If Rakshita had worked alone on the job then the number of days she would have taken to finish the job, cannot be",options:["A : 16","B : 20","C : 17","D : 21"],correct:"D"},
{id:526,origId:9,meta:"CAT/2023.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2023",text:"<img src='images/images_question_images_4422_question_1RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : [IMG:images/question_images_4422_answer_16295_1RK5CYII=1.png]","B : [IMG:images/question_images_4422_answer_16296_1RK5CYII=1.png]","C : [IMG:images/question_images_4422_answer_16297_1TkSuQmCC1.png]","D : [IMG:images/question_images_4422_answer_16298_1RK5CYII=1.png]"],correct:"B"},
{id:527,origId:10,meta:"CAT/2023.3(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2023",text:"Gautam and Suhani, working together, can finish a job in 20 days. If Gautam does only 60% of his usual work on a day, Suhani must do 150% of her usual work on that day to exactly make up for it. Then, the number of days required by the faster worker to complete the job working alone is",options:null,correct:"36"},
{id:528,origId:11,meta:"CAT/2023.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2023",text:"Pipes A and C are fill pipes while Pipe B is a drain pipe of a tank. Pipe B empties the full tank in one hour less than the time taken by Pipe A to fill the empty tank. When pipes A, B and C are turned on together, the empty tank is filled in two hours. If pipes B and C are turned on together when the tank is empty and Pipe B is turned off after one hour, then Pipe C takes another one hour and 15 minutes to fill the remaining tank. If Pipe A can fill the empty tank in less than five hours, then the time taken, in minutes, by Pipe C to fill the empty tank is",options:["A : 90","B : 120","C : 75","D : 60"],correct:"A"},
{id:529,origId:12,meta:"CAT/2023.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2023",text:"Ravi is driving at a speed of 40 km/h on a road. Vijay is 54 meters behind Ravi and driving in the same direction as Ravi. Ashok is driving along the same road from the opposite direction at a speed of 50 km/h and is 225 meters away from Ravi. The speed, in km/h, at which Vijay should drive so that all the three cross each other at the same time, is",options:["A : 61.6","B : 64.4","C : 67.2","D : 58.8"],correct:"A"},
{id:530,origId:13,meta:"CAT/2023.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2023",text:"<img src='images/images_question_images_4304_question_1RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 36/11","B : 24/11","C : 4","D : 2"],correct:"B"},
{id:531,origId:14,meta:"CAT/2023.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2023",text:"<img src='images/images_question_images_4310_question_1rkJgggEQ1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 110","B : 90","C : 80","D : 100"],correct:"D"},
{id:532,origId:15,meta:"CAT/2023.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2023",text:"The amount of job that Amal, Sunil and Kamal can individually do in a day, are in harmonic progression. Kamal takes twice as much time as Amal to do the same amount of job. If Amal and Sunil work for 4 days and 9 days, respectively, Kamal needs to work for 16 days to finish the remaining job. Then the number of days Sunil will take to finish the job working alone, is",options:null,correct:"27"},
{id:533,origId:16,meta:"CAT/2023.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2023",text:"Arvind travels from town A to town B, and Surbhi from town B to town A, both starting at the same time along the same route. After meeting each other, Arvind takes 6 hours to reach town B while Surbhi takes 24 hours to reach town A. If Arvind travelled at a speed of 54 km/h, then the distance, in km, between town A and town B is",options:null,correct:"972"},
{id:534,origId:17,meta:"CAT/2022.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2022",text:"Two cars travel from different locations at constant speeds. To meet each other after starting at the same time, they take 1.5 hours if they travel towards each other, but 10.5 hours if they travel in the same direction. If the speed of the slower car is 60 km/hr, then the distance traveled, in km, by the slower car when it meets the other car while traveling towards each other, is",options:["A : 100","B : 90","C : 120","D : 150"],correct:"B"},
{id:535,origId:18,meta:"CAT/2022.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2022",text:"Two ships are approaching a port along straight routes at constant speeds. Initially, the two ships and the port formed an equilateral triangle with sides of length 24 km. When the slower ship travelled 8 km, the triangle formed by the new positions of the two ships and the port became right-angled. When the faster ship reaches the port, the distance, in km, between the other ship and the port will be",options:["A : 4","B : 12","C : 6","D : 8"],correct:"B"},
{id:536,origId:19,meta:"CAT/2022.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2022",text:"<img src='images/images_question_images_4257_question_1RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 2","B : [IMG:images/question_images_4257_answer_15848_1rkJgggEQ1.png]","C : -2","D : [IMG:images/question_images_4257_answer_15850_1TkSuQmCC1.png]"],correct:"A"},
{id:537,origId:20,meta:"CAT/2022.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2022",text:"<img src='images/images_question_images_4261_question_11RK5CYII=1.png' alt='Q' style='max-width:100%;height:auto;border-radius:6px;margin:4px 0;'>",options:["A : 150","B : 36","C : 140","D : 23"],correct:"C"},
{id:538,origId:21,meta:"CAT/2022.3(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2022",text:"Bob can finish a job in 40 days, if he works alone. Alex is twice as fast as Bob and thrice as fast as Cole in the same job. Suppose Alex and Bob work together on the first day, Bob and Cole work together on the second day, Cole and Alex work together on the third day, and then, they continue the work by repeating this three-day roster, with Alex and Bob working together on the fourth day, and so on. Then, the total number of days Alex would have worked when the job gets finished, is",options:null,correct:"11"},
{id:539,origId:22,meta:"CAT/2022.3(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2022",text:"Moody takes 30 seconds to finish riding an escalator if he walks on it at his normal speed in the same direction. He takes 20 seconds to finish riding the escalator if he walks at twice his normal speed in the same direction. If Moody decides to stand still on the escalator, then the time, in seconds, needed to finish riding the escalator is",options:null,correct:"60"},
{id:540,origId:23,meta:"CAT/2022.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2022",text:"Two ships meet mid-ocean, and then, one ship goes south and the other ship goes west, both travelling at constant speeds. Two hours later, they are 60 km apart. If the speed of one of the ships is 6 km per hour more than the other one, then the speed, in km per hour, of the slower ship is",options:["A : 24","B : 12","C : 18","D : 20"],correct:"C"},
{id:541,origId:24,meta:"CAT/2022.2(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2022",text:"Working alone, the times taken by Anu, Tanu and Manu to complete any job are in the ratio 5 : 8 : 10. They accept a job which they can finish in 4 days if they all work together for 8 hours per day. However, Anu and Tanu work together for the first 6 days, working 6 hours 40 minutes per day. Then, the number of hours that Manu will take to complete the remaining job working alone is",options:null,correct:"6"},
{id:542,origId:25,meta:"CAT/2022.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2022",text:"Trains A and B start traveling at the same time towards each other with constant speeds from stations X and Y, respectively. Train A reaches station Y in 10 minutes while train B takes 9 minutes to reach station X after meeting train A. Then the total time taken, in minutes, by train B to travel from station Y to station X is",options:["A : 15","B : 12","C : 6","D : 10"],correct:"A"},
{id:543,origId:26,meta:"CAT/2021.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2021",text:"Anu, Vinu, and Manu can complete work alone in 15 days, 12 days, and 20 days, respectively. Vinu works every day. Anu works only on alternate days starting from the first day while Manu works only on alternate days starting from the second day. Then, the number of days needed to complete the work is",options:["A : 5","B : 6","C : 8","D : 7"],correct:"D"},
{id:544,origId:27,meta:"CAT/2021.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2021",text:"The amount Neeta and Geeta together earn in a day equals what Sita alone earns in 6 days. The amount Sita and Neeta together earn in a day equals what Geeta alone earns in 2 days. The ratio of the daily earnings of the one who earns the most to that of the one who earns the least is",options:["A : 11 : 3","B : 11 : 7","C : 3 : 2","D : 7 : 3"],correct:"A"},
{id:545,origId:28,meta:"CAT/2021.1(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2021",text:"Amar, Akbar, and Anthony are working on a project. Working together Amar and Akbar can complete the project in 1 year, Akbar and Anthony can complete in 16 months, Anthony and Amar can complete in 2 years. If the person who is neither the fastest nor the slowest works alone, the time in months he will take to complete the project is",options:null,correct:"32"},
{id:546,origId:29,meta:"CAT/2021.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2021",text:"Two trains cross each other in 14 seconds when running in opposite directions along parallel tracks. The faster train is 160 m long and crosses a lamp post in 12 seconds. If the speed of the other train is 6 km/hr less than the faster one, its length, in m, is",options:["A : 184","B : 192","C : 190","D : 180"],correct:"C"},
{id:547,origId:30,meta:"CAT/2021.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2021",text:"Two pipes A and B are attached to an empty water tank. Pipe A fills the tank while pipe B drains it. If pipe A is opened at 2 pm and pipe B is opened at 3 pm, then the tank becomes full at 10 pm. Instead, if pipe A is opened at 2 pm and pipe B is opened at 4 pm, then the tank becomes full at 6 pm. If pipe B is not opened at all, then the time, in minutes, taken to fill the tank is",options:["A : 144","B : 264","C : 140","D : 120"],correct:"A"},
{id:548,origId:31,meta:"CAT/2021.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2021",text:"Two trains A and B were moving in opposite directions, their speeds being in the ratio 5 : 3. The front end of A crossed the rear end of B 46 seconds after the front ends of the trains had crossed each other. It took another 69 seconds for the rear ends of the trains to cross each other. The ratio of length of train A to that of train B is",options:["A : 5 : 3","B : 2 : 3","C : 3 : 2","D : 2 : 1"],correct:"C"},
{id:549,origId:32,meta:"CAT/2021.2(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2021",text:"Anil can paint a house in 60 days while Bimal can paint it in 84 days. Anil starts painting and after 10 days, Bimal and Charu join him. Together, they complete the painting in 14 more days. If they are paid a total of ₹ 21000 for the job, then the share of Charu, in INR, proportionate to the work done by him, is",options:["A : 9200","B : 9100","C : 9000","D : 9150"],correct:"B"},
{id:550,origId:33,meta:"CAT/2021.3(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2021",text:"One day, Rahul started a work at 9 AM and Gautam joined him two hours later. They then worked together and completed the work at 5 PM the same day. If both had started at 9 AM and worked together, the work would have been completed 30 minutes earlier. Working alone, the time Rahul would have taken, in hours, to complete the work is",options:["A : 10","B : 12","C : 11.5","D : 12.5"],correct:"A"},
{id:551,origId:34,meta:"CAT/2021.3(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2021",text:"Mira and Amal walk along a circular track, starting from the same point at the same time. If they walk in the same direction, then in 45 minutes, Amal completes exactly 3 more rounds than Mira. If they walk in opposite directions, then they meet for the first time exactly after 3 minutes. The number of rounds Mira walks in one hour is",options:null,correct:"8"},
{id:552,origId:35,meta:"CAT/2021.3(Quantitative Ability)",type:"TITA",topic:"Time, Speed, Distance & Work",year:"2021",text:"Anil can paint a house in 12 days while Barun can paint it in 16 days. Anil, Barun, and Chandu undertake to paint the house for ₹ 24000 and the three of them together complete the painting in 6 days. If Chandu is paid in proportion to the work done by him, then the amount in INR received by him is",options:null,correct:"3000"},
{id:553,origId:36,meta:"CAT/2020.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"A train travelled at one-thirds of its usual speed, and hence reached the destination 30 minutes after the scheduled time. On its return journey, the train initially travelled at its usual speed for 5 minutes but then stopped for 4 minutes for an emergency. The percentage by which the train must now increase its usual speed so as to reach the destination at the scheduled time, is nearest to",options:["A : 58","B : 67","C : 50","D : 61"],correct:"B"},
{id:554,origId:37,meta:"CAT/2020.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"A straight road connects points A and B. Car 1 travels from A to B and Car 2 travels from B to A, both leaving at the same time. After meeting each other, they take 45 minutes and 20 minutes, respectively, to complete their journeys. If Car 1 travels at the speed of 60 km/hr, then the speed of Car 2, in km/hr, is",options:["A : 90","B : 80","C : 70","D : 100"],correct:"A"},
{id:555,origId:38,meta:"CAT/2020.1(Quantitative Ability)",type:"MCQ",topic:"Time, Speed, Distance & Work",year:"2020",text:"Two persons are walking beside a railway track at respective speeds of 2 and 4 km per hour in the same direction. A train came from behind them and crossed them in 90 and 100 seconds, respectively. The time, in seconds, taken by the train to cross an electric post is nearest to",options:["A : 87","B : 82","C : 78","D : 75"],correct:"B"},
